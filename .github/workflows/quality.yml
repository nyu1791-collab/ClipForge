name: Quality
on:
  workflow_dispatch:
    inputs:
      full_repetitions:
        description: Full CPU suite repetitions on Python 3.12 (no ASR fixture or GPU)
        type: choice
        options: ['1', '10']
        default: '1'
      video_checks:
        description: Also run the real FFmpeg remux checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: clipforge-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          enable-cache: false
      - name: Install Japanese caption font for unit tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fontconfig fonts-noto-cjk libcairo2
      - run: uv sync --locked --extra chat --extra media-fetch
      - name: Install the locked Colab control SDK (Python 3.12+ only)
        if: matrix.python == '3.12'
        run: uv pip install --require-hashes -r tools/colab-control-requirements.txt
      - name: Static checks and unit regressions
        run: |
          uv run --no-sync ruff check src tools tests
          uv run --no-sync ruff format --check src tools tests
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            repetitions=1
            if [ "${{ matrix.python }}" = '3.12' ]; then repetitions='${{ inputs.full_repetitions }}'; fi
            failed=0
            mkdir -p artifacts
            for iteration in $(seq 1 "$repetitions"); do
              echo "Full CPU suite: $iteration/$repetitions"
              uv run --no-sync python -m pytest -q -p no:cacheprovider \
                --junitxml="artifacts/full-suite-$iteration.xml" \
                >"artifacts/full-suite-$iteration.log" 2>&1 || failed=1
              tail -n 8 "artifacts/full-suite-$iteration.log"
            done
            exit "$failed"
          fi
          uv run --no-sync python -m pytest -p no:cacheprovider -m 'not integration' --cov=clipforge --cov-fail-under=90 --cov-report=term-missing --cov-report=xml --junitxml=artifacts/unit-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-unit-${{ matrix.python }}
          path: |
            artifacts/unit-results.xml
            artifacts/full-suite-*
            coverage.xml
          retention-days: 7

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Report dependency vulnerabilities and licenses
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,license
          scan-ref: .
          skip-dirs: .venv
          format: json
          output: trivy-report.json
          exit-code: '0'
      - name: Report scanner availability
        if: always()
        run: echo 'Trivy step outcome ${{ steps.trivy.outcome }} (report only)' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-vulnerabilities-and-licenses
          path: trivy-report.json
          retention-days: 7
          if-no-files-found: warn

  video:
    if: github.event_name != 'workflow_dispatch' || inputs.video_checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          enable-cache: false
      - name: Install CPU tools and Japanese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fontconfig fonts-noto-cjk libcairo2
      - run: uv sync --locked --extra chat --extra media-fetch
      - name: Real FFmpeg checks
        run: uv run --no-sync python -m pytest -m integration --junitxml=artifacts/video-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-synthetic-video
          path: artifacts/video-results.xml
          retention-days: 7
          if-no-files-found: warn
