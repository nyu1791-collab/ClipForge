name: Quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      video_checks:
        description: Also run the synthetic video and CPU ASR fixture checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: clipforge-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      media: ${{ steps.scope.outputs.media }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: scope
        env:
          PUSH_BASE: ${{ github.event.before }}
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          import subprocess
          base = os.environ.get("PUSH_BASE") or "HEAD^"
          diff = subprocess.run(["git", "diff", "--name-only", base, "HEAD"], capture_output=True, text=True)
          # A missing shallow-history base runs the media checks conservatively.
          files = diff.stdout.splitlines() if diff.returncode == 0 else ["src/clipforge/"]
          media = any(name.startswith(("src/clipforge/", "tools/make_quality_fixture.py", "tests/test_video_integration.py", ".github/workflows/quality.yml")) for name in files)
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write("media=" + str(media).lower() + "\n")
          PYTHON

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          enable-cache: false
      - name: Install Japanese caption font for unit tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fontconfig fonts-noto-cjk libcairo2
      - run: uv sync --locked --extra chat --extra media-fetch
      - name: Install the locked Colab control SDK (Python 3.12+ only)
        if: matrix.python == '3.12'
        run: uv pip install --require-hashes -r tools/colab-control-requirements.txt
      - name: Static checks and unit regressions
        run: |
          uv run --no-sync ruff check src tools tests
          uv run --no-sync ruff format --check src tools tests
          uv run --no-sync python -m pytest -p no:cacheprovider -m 'not integration and not asr' --cov=clipforge --cov-fail-under=90 --cov-report=term-missing --cov-report=xml --junitxml=artifacts/unit-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-unit-${{ matrix.python }}
          path: |
            artifacts/unit-results.xml
            coverage.xml
          retention-days: 7

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Report dependency vulnerabilities and licenses
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,license
          scan-ref: .
          skip-dirs: .venv
          format: json
          output: trivy-report.json
          exit-code: '0'
      - name: Report scanner availability
        if: always()
        run: echo 'Trivy step outcome ${{ steps.trivy.outcome }} (report only)' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-vulnerabilities-and-licenses
          path: trivy-report.json
          retention-days: 7
          if-no-files-found: warn

  video:
    needs: scope
    if: (github.event_name == 'workflow_dispatch' && inputs.video_checks) || (github.event_name != 'workflow_dispatch' && needs.scope.outputs.media == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLIPFORGE_FIXTURE_PATH: ${{ github.workspace }}/artifacts/quality-fixture/source.mp4
      CLIPFORGE_QA_OUTPUT: ${{ github.workspace }}/artifacts/quality-outputs
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          enable-cache: false
      - name: Install CPU tools and Japanese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fontconfig fonts-noto-cjk libcairo2 espeak-ng open-jtalk open-jtalk-mecab-naist-jdic hts-voice-nitech-jp-atr503-m001
      - run: uv sync --locked --extra chat --extra media-fetch
      - name: Generate labelled synthetic video and speech
        run: uv run --no-sync python tools/make_quality_fixture.py --output artifacts/quality-fixture --japanese
      - name: Real video and speech-recognition checks
        run: uv run --no-sync python -m pytest -m 'integration or asr' --junitxml=artifacts/video-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-synthetic-video
          path: |
            artifacts/quality-fixture/source.mp4
            artifacts/quality-fixture/source-japanese.mp4
            artifacts/quality-fixture/fixture.json
            artifacts/quality-outputs/preview-*.png
            artifacts/video-results.xml
          retention-days: 7
          if-no-files-found: warn
