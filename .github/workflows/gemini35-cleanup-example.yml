name: Gemini 3.5 fictional subtitle cleanup
run-name: Gemini 3.5 fictional cleanup ${{ github.run_id }}
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  example:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.23
          enable-cache: true
      - run: uv sync --locked --no-dev
      - name: Connect the designated Vertex identity
        id: vertex
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/${{ vars.CLIPFORGE_VERTEX_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/clipforge-actions/providers/github
          service_account: clipforge-vertex@project-fdadb4dd-cb77-4270-9cd.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 3600s
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: false
          export_environment_variables: false
      - name: Submit the fictional text once
        env:
          CLIPFORGE_VERTEX_ACCESS_TOKEN: ${{ steps.vertex.outputs.access_token }}
        run: .venv/bin/python tools/test_gemini35_cleanup_example.py
