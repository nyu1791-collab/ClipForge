{
  "name": "ClipForge Drive delivery",
  "run-name": "ClipForge Drive ${{ inputs.mode }} ${{ inputs.input_tag }}",
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "clipforge-drive-delivery",
    "cancel-in-progress": false
  },
  "jobs": {
    "upload-release": {
      "if": "github.repository == 'nyu1791-collab/ClipForge' && inputs.mode == 'upload-release'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Transfer completed render outputs to private Drive",
          "env": {
            "COLAB_ADC_JSON": "${{ secrets.COLAB_ADC_JSON }}",
            "GOOGLE_DRIVE_ADC_JSON": "${{ secrets.GOOGLE_DRIVE_ADC_JSON }}",
            "GH_TOKEN": "${{ secrets.CLIPFORGE_PAT }}",
            "RENDER_RUN": "${{ inputs.render_run }}",
            "RENDER_REQUEST": "${{ inputs.render_request }}",
            "SOURCE_REF": "${{ inputs.source_ref }}",
            "PYTHONPATH": "src"
          },
          "run": "python3 tools/clipforge_release_delivery.py"
        }
      ]
    }
  },
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "mode": {
          "type": "choice",
          "options": [
            "upload-release"
          ],
          "default": "upload-release"
        },
        "input_tag": {
          "type": "string",
          "default": ""
        },
        "folder_name": {
          "type": "string",
          "default": ""
        },
        "individual_clips": {
          "type": "boolean",
          "default": false
        },
        "render_run": {
          "type": "string",
          "default": ""
        },
        "render_request": {
          "type": "string",
          "default": ""
        },
        "source_ref": {
          "type": "string",
          "default": ""
        }
      }
    }
  }
}
