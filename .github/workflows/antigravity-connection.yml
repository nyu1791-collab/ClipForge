name: Check Antigravity Vertex models
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/${{ vars.CLIPFORGE_VERTEX_PROJECT_NUMBER || '793547679344' }}/locations/global/workloadIdentityPools/clipforge-actions/providers/github
          service_account: clipforge-vertex@project-fdadb4dd-cb77-4270-9cd.iam.gserviceaccount.com
          create_credentials_file: true
      - name: Check small agent requests
        run: |
          python -m pip install google-antigravity==0.1.22
          python tools/check_antigravity_vertex.py
