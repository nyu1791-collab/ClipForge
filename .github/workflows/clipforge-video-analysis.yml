{
  "name": "Gemini direct YouTube analysis",
  "run-name": "Gemini video analysis ${{ inputs.request_id }}",
  "permissions": {
    "contents": "read",
    "id-token": "write"
  },
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "source_ref": {
          "type": "string",
          "required": true
        },
        "video_url": {
          "type": "string",
          "required": true
        },
        "request_id": {
          "type": "string",
          "required": true
        }
      }
    }
  },
  "jobs": {
    "video-analysis": {
      "if": "github.repository == 'nyu1791-collab/ClipForge'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "env": {
        "PYTHONPATH": "src"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "${{ inputs.source_ref }}",
            "persist-credentials": false,
            "repository": "nyu1791-collab/ClipForge"
          }
        },
        {
          "name": "Connect the designated Vertex identity",
          "id": "vertex",
          "uses": "google-github-actions/auth@v3",
          "with": {
            "workload_identity_provider": "projects/${{ vars.CLIPFORGE_VERTEX_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/clipforge-actions/providers/github",
            "service_account": "clipforge-vertex@project-fdadb4dd-cb77-4270-9cd.iam.gserviceaccount.com",
            "token_format": "access_token",
            "access_token_lifetime": "900s",
            "access_token_scopes": "https://www.googleapis.com/auth/cloud-platform",
            "create_credentials_file": false,
            "export_environment_variables": false
          }
        },
        {
          "name": "Analyze the YouTube video with Gemini 3.8 directly",
          "env": {
            "CLIPFORGE_VERTEX_ACCESS_TOKEN": "${{ steps.vertex.outputs.access_token }}",
            "VIDEO_URL": "${{ inputs.video_url }}"
          },
          "run": "python3 -m clipforge.vertex_video --url \"$VIDEO_URL\" --output \"$RUNNER_TEMP/video-analysis\""
        },
        {
          "name": "Save the analysis and timing privately",
          "if": "always()",
          "env": {
            "GH_TOKEN": "${{ secrets.CLIPFORGE_PAT }}"
          },
          "run": "if [ -f \"$RUNNER_TEMP/video-analysis/video-analysis-receipt.json\" ]; then\n gh release create \"clipforge-video-analysis-$GITHUB_RUN_ID\" \"$RUNNER_TEMP/video-analysis/\"*.json --repo nyu1791-collab/ai-model-workers --latest=false --title \"Gemini video analysis $GITHUB_RUN_ID\" --notes \"Direct YouTube input. One request, no retry.\"\nfi"
        }
      ]
    }
  }
}
