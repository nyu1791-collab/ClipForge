name: Offline regression checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clipforge-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          enable-cache: false
      - name: Install font tools for layout checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fontconfig fonts-noto-cjk
      - name: Install locked package
        run: uv sync --locked --no-dev
      - name: Check offline contracts, layout and resume behavior
        run: uv run python -m unittest discover -s tests -v
      - name: Verify published schema matches runtime model
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          from clipforge.batch_models import ClipsManifest
          assert json.loads(Path('schemas/clips_manifest.schema.json').read_text()) == ClipsManifest.model_json_schema()
          PY
