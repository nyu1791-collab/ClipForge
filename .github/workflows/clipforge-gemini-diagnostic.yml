name: ClipForge one-request Gemini diagnosis
run-name: ClipForge Gemini diagnostic ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      source_ref:
        required: true
        type: string
      request_id:
        required: true
        type: string
      parent_release:
        required: true
        type: string
      failed_phase:
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: clipforge-gemini-diagnostic-${{ inputs.request_id }}
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.CLIPFORGE_PAT }}
      PYTHONPATH: src
      PARENT_RELEASE: ${{ inputs.parent_release }}
      FAILED_PHASE: ${{ inputs.failed_phase }}
      DIAGNOSTIC_OUTPUT: ${{ runner.temp }}/gemini-diagnostic
      DIAGNOSTIC_ID: ${{ inputs.request_id }}
    steps:
      - name: Require the designated branch and a single attempt
        env:
          RUN_REF: ${{ github.ref }}
          ATTEMPT: ${{ github.run_attempt }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          test "$RUN_REF" = refs/heads/fix/pr18-verified-transfer
          test "$ATTEMPT" = 1
          test -n "$GH_TOKEN"
          [[ "$SOURCE_REF" =~ ^[a-f0-9]{40}$ ]]
          [[ "$DIAGNOSTIC_ID" =~ ^[a-f0-9]{32}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.23
      - run: uv sync --locked --no-dev
      - name: Connect the same designated Vertex identity
        id: vertex
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/${{ vars.CLIPFORGE_VERTEX_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/clipforge-actions/providers/github
          service_account: clipforge-vertex@project-fdadb4dd-cb77-4270-9cd.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 3600s
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: false
          export_environment_variables: false
      - name: Repeat only the explicitly authorized failed request once
        env:
          CLIPFORGE_VERTEX_ACCESS_TOKEN: ${{ steps.vertex.outputs.access_token }}
        run: .venv/bin/python tools/diagnose_saved_gemini_request.py
      - name: Preserve diagnostics privately without readback
        if: always()
        run: |
          if [ -d "$DIAGNOSTIC_OUTPUT" ]; then
            shopt -s nullglob
            reports=("$DIAGNOSTIC_OUTPUT/"*.json "$DIAGNOSTIC_OUTPUT/"*.txt)
            if [ ${#reports[@]} -gt 0 ]; then
              gh release create "clipforge-gemini-diagnostic-$DIAGNOSTIC_ID" "${reports[@]}" \
                --repo nyu1791-collab/ai-model-workers --latest=false \
                --notes 'One user-authorized repeat of one failed saved request; private diagnostics; no automatic retries.'
            fi
          fi
