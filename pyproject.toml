[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "clipforge"
version = "0.2.1"
description = "CPU video clipping with timestamped transcription, visual Gemini selection and ASS captions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "faster-whisper==1.2.1",
  "scenedetect-headless==0.7.2",
  "google-genai==2.32.0",
  "pysubs2==1.8.1",
  "pydantic>=2.11,<3",
  "budoux==0.10.0",
  "cairosvg==2.9.1",
  "fonttools==4.67.0",
  "pillow==13.0.0",
]

[project.optional-dependencies]
chat = ["chat-downloader==0.2.8"]

[project.scripts]
clipforge = "clipforge.cli:main"

[project.urls]
Repository = "https://github.com/nyu1791-collab/ClipForge"
Issues = "https://github.com/nyu1791-collab/ClipForge/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "integration: real FFmpeg, font and video checks (GitHub runner)",
  "asr: real CPU speech recognition with downloaded model weights (GitHub runner)",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-cov>=6,<8",
    "ruff==0.14.14",
]
