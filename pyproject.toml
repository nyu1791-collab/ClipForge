[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "clipforge"
version = "0.2.0"
description = "CPU/CUDA video clipping with timestamped transcription, visual Gemini selection and ASS captions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "faster-whisper==1.2.1",
  "scenedetect-headless==0.7.2",
  "google-genai==2.32.0",
  "pysubs2==1.8.1",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
chat = ["chat-downloader==0.2.8"]
cuda = [
  "nvidia-cublas-cu12>=12.4,<13; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "nvidia-cudnn-cu12>=9,<10; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.scripts]
clipforge = "clipforge.cli:main"

[project.urls]
Repository = "https://github.com/nyu1791-collab/ClipForge"
Issues = "https://github.com/nyu1791-collab/ClipForge/issues"

[tool.setuptools.packages.find]
where = ["src"]
