[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "clipforge"
version = "0.3.0"
description = "CPU video clipping with timestamped transcription, visual Gemini selection and ASS captions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "faster-whisper==1.2.1",
  "scenedetect-headless==0.7.2",
  "google-genai==2.32.0",
  "pysubs2==1.8.1",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
chat = ["chat-downloader==0.2.8"]
platforms = ["cryptography>=46,<51"]
media-fetch = ["yt-dlp[default,curl-cffi]==2026.8.19", "curl-cffi==0.16.3"]

[project.scripts]
clipforge = "clipforge.cli:main"
clipforge-platforms = "clipforge.integrations.cli:main"

[project.urls]
Repository = "https://github.com/nyu1791-collab/ClipForge"
Issues = "https://github.com/nyu1791-collab/ClipForge/issues"

[tool.setuptools.packages.find]
where = ["src"]
