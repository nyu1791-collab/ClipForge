[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "clipforge"
version = "0.3.0"
description = "CPU video clipping with timestamped transcription, visual Gemini selection and ASS captions"
readme = "README.md"
license-files = ["third_party/*-LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "faster-whisper==1.2.1",
  "scenedetect-headless==0.7.2",
  "google-genai==2.32.0",
  "pysubs2==1.8.1",
  "pydantic>=2.11,<3",
  "budoux==0.10.0",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
chat = ["chat-downloader==0.2.8"]

[project.scripts]
clipforge = "clipforge.cli:main"

[project.urls]
Repository = "https://github.com/nyu1791-collab/ClipForge"
Issues = "https://github.com/nyu1791-collab/ClipForge/issues"

[tool.setuptools.packages.find]
where = ["src"]
