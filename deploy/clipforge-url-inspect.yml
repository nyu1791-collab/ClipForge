name: ClipForge URL metadata inspection
on:
  workflow_dispatch:
    inputs:
      source_ref:
        type: string
        required: true
        description: Exact reviewed source SHA
      video_url:
        type: string
        required: true
        description: Same public YouTube URL; metadata only
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'nyu1791-collab/ai-model-workers'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLIPFORGE_VIDEO_URL: ${{ inputs.video_url }}
      SOURCE_REF: ${{ inputs.source_ref }}
    steps:
      - name: Validate source revision
        run: |
          python3 - <<'PY'
          import os,re
          assert re.fullmatch('[a-f0-9]{40}',os.environ['SOURCE_REF'])
          PY
      - uses: actions/checkout@v4
        with:
          repository: nyu1791-collab/ClipForge
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          enable-cache: false
      - run: uv sync --locked --extra download --no-dev
      - name: Inspect metadata once; no inference credentials
        run: uv run --no-sync python tools/inspect_youtube.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: url-inspection-${{ github.run_id }}
          path: artifacts/url-inspection.json
          retention-days: 7
