name: ClipForge captions
run-name: ClipForge captions for run ${{ inputs.previous_run_id }}
on:
  workflow_dispatch:
    inputs:
      previous_run_id:
        description: Successful analysis run whose clipforge-analysis or clipforge-result artifact holds audio.m4a
        type: string
        required: true
      source_ref:
        description: Reviewed ClipForge commit that converts the recognition into captions
        type: string
        required: true
      review_json:
        description: The approved review; captions are recognised for each of its clip intervals
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: clipforge-captions
  cancel-in-progress: false
jobs:
  captions:
    if: github.repository == 'nyu1791-collab/ai-model-workers' && github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PREVIOUS_RUN: ${{ inputs.previous_run_id }}
      SOURCE_REF: ${{ inputs.source_ref }}
      REVIEW_JSON: ${{ inputs.review_json }}
    steps:
      - name: Validate the request and keep the review private
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          assert re.fullmatch('[0-9]{1,20}', os.environ['PREVIOUS_RUN'])
          assert re.fullmatch('[a-f0-9]{40}', os.environ['SOURCE_REF'])
          text = os.environ['REVIEW_JSON']
          assert text and len(text.encode()) <= 60000
          clips = json.loads(text)['clips']
          assert 1 <= len(clips) <= 20
          for clip in clips:
              assert re.fullmatch('topic-[0-9]{3}', clip['candidate_id'])
              assert 0 <= float(clip['start']) < float(clip['end'])
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'review.json'
          path.write_text(text)
          path.chmod(0o600)
          PY
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nyu1791-collab/ClipForge
          ref: ${{ inputs.source_ref }}
          path: clipforge-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the locked Google Colab control SDK
        timeout-minutes: 10
        run: python -m pip install -q --require-hashes -r clipforge-source/tools/colab-control-requirements.txt
      - name: Cut the reviewed intervals from the analysed audio
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ $(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREVIOUS_RUN" --jq .conclusion) == success ]] \
            || { echo 'the analysis run did not succeed'; exit 1; }
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREVIOUS_RUN/artifacts" --jq \
            '[.artifacts[] | select(.name | test("^clipforge-(analysis|result)-[a-f0-9]{32}$"))] | sort_by(.name) | .[0].id')
          [[ $id =~ ^[0-9]+$ ]] || { echo 'no analysis artifact with audio'; exit 1; }
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq; sudo apt-get install -y -qq ffmpeg; }
          mkdir -p "$RUNNER_TEMP/art" asr-eval-clips
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/art.zip"
          unzip -q -o "$RUNNER_TEMP/art.zip" audio.m4a -d "$RUNNER_TEMP/art"
          python3 - <<'PY'
          import json, os, subprocess
          clips = json.load(open(os.path.join(os.environ['RUNNER_TEMP'], 'review.json')))['clips']
          audio = os.path.join(os.environ['RUNNER_TEMP'], 'art', 'audio.m4a')
          for index, clip in enumerate(clips, 1):
              start, end = float(clip['start']), float(clip['end'])
              subprocess.run(['ffmpeg', '-v', 'error', '-y', '-ss', f'{start:.3f}', '-t', f'{end - start:.3f}',
                              '-i', audio, '-ac', '1', '-ar', '16000', f'asr-eval-clips/c{index}.wav'], check=True)
          PY
          rm -f "$RUNNER_TEMP/art.zip" "$RUNNER_TEMP/art/audio.m4a"
      - name: Recognise the intervals with Parakeet on one owned Colab GPU
        timeout-minutes: 80
        env:
          COLAB_ADC_JSON: ${{ secrets.COLAB_ADC_JSON }}
          ASR_MODELS: parakeet
        run: python clipforge_asr_eval.py
      - name: Release the Colab runtime if it is still held
        if: always()
        timeout-minutes: 5
        env:
          COLAB_ADC_JSON: ${{ secrets.COLAB_ADC_JSON }}
        run: python clipforge_asr_eval.py release
      - name: Convert the recognition into packed captions
        run: |
          PYTHONPATH=clipforge-source/src python -m clipforge.parakeet_captions \
            --review "$RUNNER_TEMP/review.json" --results asr-eval-out --output captions.json
      - uses: actions/upload-artifact@v4
        with:
          name: clipforge-captions-${{ github.run_id }}
          path: captions.json
          retention-days: 7
          if-no-files-found: error
