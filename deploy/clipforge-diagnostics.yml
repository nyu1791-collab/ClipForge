name: ClipForge API diagnostic
run-name: ClipForge API diagnostic ${{ inputs.source_ref }}
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact ClipForge commit SHA
        type: string
        required: true
      model:
        description: Model identifier to check; no generation
        type: string
        required: true
permissions:
  contents: read
jobs:
  diagnose:
    if: github.repository == 'nyu1791-collab/ai-model-workers'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_REF: ${{ inputs.source_ref }}
      GEMINI_MODEL: ${{ inputs.model }}
    steps:
      - name: Validate identifiers
        run: |
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'[a-f0-9]{40}',os.environ['SOURCE_REF'])
          assert re.fullmatch(r'(?:models/)?[A-Za-z0-9._-]+',os.environ['GEMINI_MODEL'])
          PY
      - uses: actions/checkout@v4
        with:
          repository: nyu1791-collab/ClipForge
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          enable-cache: false
      - name: Install tools without API credentials
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          uv sync --locked --no-dev
      - name: Generate six-second synthetic diagnostic media
        run: |
          mkdir -p artifacts
          ffmpeg -hide_banner -v error -n -f lavfi -i 'color=c=blue:s=320x180:r=10:d=6' -f lavfi -i 'sine=frequency=440:sample_rate=16000:duration=6' -c:v libx264 -preset ultrafast -threads 2 -pix_fmt yuv420p -c:a aac -shortest artifacts/synthetic.mp4
      - name: Check model, upload and token-count endpoints
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: uv run --no-sync python tools/check_gemini_connection.py --video artifacts/synthetic.mp4 --model "$GEMINI_MODEL" --output artifacts/gemini-diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clipforge-api-diagnostic-${{ github.run_id }}
          path: artifacts/gemini-diagnostic.json
          retention-days: 7
          if-no-files-found: warn
