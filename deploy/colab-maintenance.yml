name: Colab GPU verification and asset preparation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify T4 CUDA/Whisper or prepare public assets on a CPU Colab first
        type: choice
        options: [verify-gpu, prepare-cache]
        default: verify-gpu
      offline:
        description: Require cached runtime packages and models without new downloads
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: clipforge-video
  cancel-in-progress: false

jobs:
  colab:
    if: github.repository == 'nyu1791-collab/ai-model-workers'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      CLIPFORGE_OFFLINE: ${{ inputs.offline && '1' || '0' }}
    steps:
      - name: Check one-time OAuth setup without allocating resources
        env:
          COLAB_ADC_JSON: ${{ secrets.COLAB_ADC_JSON }}
        run: |
          python3 - <<'PY'
          import os
          if not os.environ.get('COLAB_ADC_JSON'):
              raise SystemExit('COLAB_ADC_JSON is missing; no GPU/CPU Colab runtime was allocated.')
          PY
      - uses: actions/checkout@v4
        with:
          repository: nyu1791-collab/ClipForge
          ref: main
          path: clipforge-source
          persist-credentials: false
      - name: Record the exact source SHA
        run: echo "CLIPFORGE_SOURCE_REF=$(git -C clipforge-source rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          enable-cache: true
          cache-dependency-glob: clipforge-source/tools/colab-control-requirements.txt
      - name: Install the locked control SDK
        id: control
        run: |
          uv venv "$RUNNER_TEMP/colab-control" --python 3.12
          uv pip install --python "$RUNNER_TEMP/colab-control/bin/python" --require-hashes \
            -r clipforge-source/tools/colab-control-requirements.txt
      - name: Allocate only the requested Colab hardware
        env:
          COLAB_ADC_JSON: ${{ secrets.COLAB_ADC_JSON }}
          COLAB_JOB_MODE: ${{ inputs.mode }}
        run: |
          "$RUNNER_TEMP/colab-control/bin/python" clipforge-source/tools/colab_actions.py start --mode "$COLAB_JOB_MODE"
      - name: Verify CUDA inference or prepare the next runtime's cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/colab-control/bin/python" clipforge-source/tools/colab_actions.py run
      - name: Release and verify removal of the owned runtime
        if: always() && steps.control.outcome == 'success'
        run: |
          "$RUNNER_TEMP/colab-control/bin/python" clipforge-source/tools/colab_actions.py stop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: colab-verification-report
          path: ${{ runner.temp }}/clipforge-out/
          retention-days: 7
          if-no-files-found: warn
