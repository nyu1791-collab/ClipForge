name: ClipForge
run-name: ClipForge ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: VM-generated request identifier (32 lowercase hex characters)
        type: string
        required: true
      input_tag:
        description: Temporary private input release tag
        type: string
        required: true
      source_ref:
        description: Exact reviewed ClipForge commit SHA
        type: string
        required: true
      worker:
        description: Automatic Colab T4 or explicit CPU
        type: choice
        options: [colab-auto, cpu]
        default: colab-auto
      shape:
        description: Colab runtime shape for colab-auto (high-ram has 8 CPU cores and 51 GB)
        type: choice
        options: [high-ram, standard]
        default: high-ram
      audio_url:
        description: Kick, YouTube, Twitch or owned HTTPS mp4/m4a/mp3/webm/m3u8 URL
        type: string
        default: ''
      settings_json:
        description: URL-only audio analysis settings JSON (at most 16 KB)
        type: string
        default: '{}'
      auto_previews:
        description: Continue URL-only analysis with CPU previews and an unapproved review draft
        type: boolean
        default: false
      public_cache:
        description: Restore and publish the GPU public cache on colab-auto (off by default, since a fresh setup took 40 s versus 104 s with the cache)
        type: choice
        options: ['on', 'off']
        default: 'off'
      probe_only:
        description: Diagnose URL metadata and provider errors without downloading media or allocating Colab
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

# Each request may own two ASR runtimes. Serialize requests across worker kinds.
concurrency:
  group: clipforge-video
  cancel-in-progress: false

jobs:
  clip:
    if: github.repository == 'nyu1791-collab/ai-model-workers' && inputs.worker == 'cpu' && !inputs.probe_only
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CLIPFORGE_SOURCE_REF: ${{ inputs.source_ref }}
      INPUT_TAG: ${{ inputs.input_tag }}
      REQUEST_ID: ${{ inputs.request_id }}
      PYTHONUNBUFFERED: '1'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      CLIPFORGE_REQUIRE_CUDA: '0'
    steps:
      - name: Validate request identifiers
        timeout-minutes: 10
        env:
          AUTO_PREVIEWS: ${{ inputs.auto_previews }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r'[a-f0-9]{32}', os.environ['REQUEST_ID'])
          assert re.fullmatch(r'[a-f0-9]{40}', os.environ['CLIPFORGE_SOURCE_REF'])
          assert os.environ['INPUT_TAG'] == 'clipforge-input-' + os.environ['REQUEST_ID']
          assert os.environ['AUTO_PREVIEWS'] != 'true', 'auto_previews requires colab-auto and audio_url'
          PY
      - uses: actions/checkout@v4
        timeout-minutes: 10
        with:
          repository: nyu1791-collab/ClipForge
          ref: ${{ inputs.source_ref }}
          path: clipforge-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        timeout-minutes: 10
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        timeout-minutes: 10
        with:
          version: '0.12.23'
          enable-cache: false
      - name: Install media tools and Japanese fonts
        timeout-minutes: 10
        run: |
          if [ "$(id -u)" = 0 ]; then APT=(apt-get); else APT=(sudo apt-get); fi
          "${APT[@]}" update -qq
          "${APT[@]}" install -y --no-install-recommends ffmpeg fontconfig fonts-noto-cjk gh libcairo2
      - name: Install locked Python dependencies without API credentials
        timeout-minutes: 10
        working-directory: clipforge-source
        shell: bash
        run: |
          uv sync --locked --extra chat --no-dev
      - name: Download and validate temporary private input
        timeout-minutes: 10
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          clipforge-source/.venv/bin/python clipforge-source/tools/run_request.py prepare \
            --tag "$INPUT_TAG" --directory "$RUNNER_TEMP/clipforge-input"
      - uses: actions/cache/restore@v4
        timeout-minutes: 10
        id: stages
        with:
          key: clipforge-stages-v1-${{ steps.prepare.outputs.cache_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: clipforge-stages-v1-${{ steps.prepare.outputs.cache_key }}-
          path: |
            ${{ runner.temp }}/clipforge-out/input.json
            ${{ runner.temp }}/clipforge-out/transcript.json
            ${{ runner.temp }}/clipforge-out/scenes.json
            ${{ runner.temp }}/clipforge-out/chat.json
            ${{ runner.temp }}/clipforge-out/candidates.json
            ${{ runner.temp }}/clipforge-out/selection.json
            ${{ runner.temp }}/clipforge-out/.state
      - name: Run the requested ClipForge stage (audio analysis makes no model calls)
        timeout-minutes: 80
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          clipforge-source/.venv/bin/python clipforge-source/tools/run_request.py run \
            --tag "$INPUT_TAG" --directory "$RUNNER_TEMP/clipforge-input" \
            --output "$RUNNER_TEMP/clipforge-out"
      - name: Keep partial transcript privately after failure, timeout or cancellation
        timeout-minutes: 10
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: clipforge-partial-${{ inputs.request_id }}
          path: ${{ runner.temp }}/clipforge-out/transcripts/*.partial.jsonl
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/cache/save@v4
        timeout-minutes: 10
        if: always() && steps.prepare.outcome == 'success'
        continue-on-error: true
        with:
          key: ${{ steps.stages.outputs.cache-primary-key }}
          path: |
            ${{ runner.temp }}/clipforge-out/input.json
            ${{ runner.temp }}/clipforge-out/transcript.json
            ${{ runner.temp }}/clipforge-out/scenes.json
            ${{ runner.temp }}/clipforge-out/chat.json
            ${{ runner.temp }}/clipforge-out/candidates.json
            ${{ runner.temp }}/clipforge-out/selection.json
            ${{ runner.temp }}/clipforge-out/.state
      - uses: actions/upload-artifact@v4
        timeout-minutes: 10
        if: always()
        with:
          name: clipforge-result-${{ inputs.request_id }}
          path: ${{ runner.temp }}/clipforge-out/
          compression-level: 0
          retention-days: 7
          if-no-files-found: warn
      - name: Delete temporary private input
        id: input-cleanup
        timeout-minutes: 10
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        # Uses only the preinstalled gh, so cleanup still runs when checkout or setup failed.
        run: |
          if ! [[ $INPUT_TAG =~ ^clipforge-input-[a-f0-9]{32}$ ]]; then
            echo 'Unexpected temporary input tag; nothing was deleted.' >&2
            exit 1
          fi
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" != true ]; then
            echo 'The worker repository must remain private; nothing was deleted.' >&2
            exit 1
          fi
          if gh release view "$INPUT_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$INPUT_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            echo 'Temporary private input release deleted.'
          else
            echo 'No temporary private input release remains.'
          fi
      - name: Report a temporary input that could not be deleted
        timeout-minutes: 5
        if: always() && steps.input-cleanup.outcome != 'success'
        run: |
          echo "::warning title=Temporary private input remains::$INPUT_TAG may still hold private input. Delete it with tools/submit_job.py --cleanup-tag $INPUT_TAG."
          {
            echo '### Temporary private input remains'
            echo "The release \`$INPUT_TAG\` could not be confirmed deleted. Delete it with \`tools/submit_job.py --cleanup-tag $INPUT_TAG\`."
          } >> "$GITHUB_STEP_SUMMARY"

  colab-auto:
    if: github.repository == 'nyu1791-collab/ai-model-workers' && inputs.worker == 'colab-auto' && !inputs.probe_only
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CLIPFORGE_SOURCE_REF: ${{ inputs.source_ref }}
      INPUT_TAG: ${{ inputs.input_tag }}
      REQUEST_ID: ${{ inputs.request_id }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Validate request and one-time Colab OAuth setup
        timeout-minutes: 10
        env:
          COLAB_ADC_JSON: ${{ secrets.COLAB_ADC_JSON }}
          AUDIO_URL: ${{ inputs.audio_url }}
          AUTO_PREVIEWS: ${{ inputs.auto_previews }}
        run: |
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r'[a-f0-9]{32}', os.environ['REQUEST_ID'])
          assert re.fullmatch(r'[a-f0-9]{40}', os.environ['CLIPFORGE_SOURCE_REF'])
          assert os.environ['INPUT_TAG'] == 'clipforge-input-' + os.environ['REQUEST_ID']
          assert os.environ['AUTO_PREVIEWS'] != 'true' or os.environ['AUDIO_URL']
          if os.environ['AUDIO_URL']:
              from urllib.parse import urlsplit
              assert urlsplit(os.environ['AUDIO_URL']).scheme == 'https'
          if not os.environ.get('COLAB_ADC_JSON'):
              raise SystemExit('COLAB_ADC_JSON is missing. Authorize n.yu17919191@gmail.com once; no GPU was allocated.')
          PY
      - uses: actions/checkout@v4
        timeout-minutes: 10
        with:
          repository: nyu1791-collab/ClipForge
          ref: ${{ inputs.source_ref }}
          path: clipforge-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        timeout-minutes: 10
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        timeout-minutes: 10
        with:
          version: '0.12.23'
          enable-cache: true
          cache-dependency-glob: clipforge-source/tools/colab-control-requirements.txt
      - name: Install the locked Google Colab control SDK without ASR or CUDA packages
        timeout-minutes: 10
        id: control
        run: |
          uv venv "$RUNNER_TEMP/colab-control" --python 3.12
          uv pip install --python "$RUNNER_TEMP/colab-control/bin/python" --require-hashes \
            -r clipforge-source/tools/colab-control-requirements.txt
      - name: Install locked audio acquisition dependencies without API credentials
        timeout-minutes: 10
        if: inputs.audio_url != ''
        working-directory: clipforge-source
        run: uv sync --locked --extra media-fetch --no-dev
      - uses: actions/setup-node@v4
        timeout-minutes: 10
        if: inputs.audio_url != ''
        with:
          node-version: '22.23.3'
      - name: Ensure media tools for URL probing and lossless ASR splitting
        timeout-minutes: 10
        if: inputs.audio_url != ''
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: Initialize the pinned YouTube audio transport
        id: youtube_transport
        timeout-minutes: 12
        if: inputs.audio_url != '' && fromJSON(inputs.settings_json).youtube_audio_transport == 'warp'
        working-directory: clipforge-source
        env:
          AUDIO_URL: ${{ inputs.audio_url }}
        run: uv run --no-sync python tools/youtube_transport.py setup --state-dir "$RUNNER_TEMP/clipforge-youtube" --url "$AUDIO_URL"
      - name: Acquire audio and stage verified private input before GPU allocation
        timeout-minutes: 30
        if: inputs.audio_url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIO_URL: ${{ inputs.audio_url }}
          SETTINGS_JSON: ${{ inputs.settings_json }}
          AUTO_PREVIEWS: ${{ inputs.auto_previews }}
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: |
          gh release create "$INPUT_TAG" --repo "$GITHUB_REPOSITORY" --target main \
            --title "$INPUT_TAG" --latest=false \
            --notes 'Temporary private ClipForge URL input. Automatically cleaned after execution.'
          video_options=()
          if [ "$AUTO_PREVIEWS" = true ]; then video_options+=(--require-video); fi
          clipforge-source/.venv/bin/python clipforge-source/tools/acquire_audio_url.py \
            --url "$AUDIO_URL" --request-id "$REQUEST_ID" --source-ref "$CLIPFORGE_SOURCE_REF" \
            --settings-json "$SETTINGS_JSON" \
            --directory "$RUNNER_TEMP/clipforge-input" "${video_options[@]}"
          gh release upload "$INPUT_TAG" --repo "$GITHUB_REPOSITORY" \
            "$RUNNER_TEMP/clipforge-input/input-video.bin" \
            "$RUNNER_TEMP/clipforge-input/request.json"
      - name: Close YouTube audio transport before allocating a GPU
        timeout-minutes: 2
        if: always() && inputs.audio_url != '' && fromJSON(inputs.settings_json).youtube_audio_transport == 'warp'
        working-directory: clipforge-source
        run: uv run --no-sync python tools/youtube_transport.py cleanup --state-dir "$RUNNER_TEMP/clipforge-youtube"
      - name: Keep private URL acquisition and transport receipts
        timeout-minutes: 2
        if: always() && inputs.audio_url != ''
        uses: actions/upload-artifact@v4
        with:
          name: clipforge-acquisition-${{ inputs.request_id }}
          path: |
            ${{ runner.temp }}/clipforge-youtube/
            ${{ runner.temp }}/clipforge-input/acquisition-report.json
          retention-days: 7
          if-no-files-found: warn
      - name: Identify model API requirements from the staged request
        timeout-minutes: 10
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIO_URL: ${{ inputs.audio_url }}
        run: |
          gh release download "$INPUT_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern request.json --dir "$RUNNER_TEMP/clipforge-model-request"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          request = json.loads((Path(os.environ['RUNNER_TEMP']) / 'clipforge-model-request/request.json').read_text())
          assert request['request_id'] == os.environ['REQUEST_ID']
          assert request['source_ref'] == os.environ['CLIPFORGE_SOURCE_REF']
          no_model_api = '1' if request.get('audio_source_url') else '0'
          parts = request.get('settings', {}).get('asr_parts', 1)
          assert type(parts) is int and parts in (1, 2)
          assert parts == 1 or (request.get('audio_source_url') and os.environ.get('AUDIO_URL'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'no_model_api={no_model_api}\n')
              output.write(f'asr_parts={parts}\n')
          PY
      - name: Allocate a dedicated T4 for the verified Google account
        timeout-minutes: 20
        if: steps.request.outputs.asr_parts != '2'
        id: allocate
        env:
          COLAB_ADC_JSON: ${{ secrets.COLAB_ADC_JSON }}
          CLIPFORGE_COLAB_SHAPE: ${{ inputs.shape }}
          CLIPFORGE_PUBLIC_CACHE: ${{ inputs.public_cache || 'off' }}
        run: |
          "$RUNNER_TEMP/colab-control/bin/python" clipforge-source/tools/colab_actions.py start
      - name: Run the pipeline on Colab and retrieve verified private outputs
        timeout-minutes: 90
        if: steps.request.outputs.asr_parts != '2'
        env:
          GH_TOKEN: ${{ github.token }}
          CLIPFORGE_NO_MODEL_API: ${{ steps.request.outputs.no_model_api }}
          GEMINI_API_KEY: ${{ steps.request.outputs.no_model_api == '0' && secrets.GEMINI_API_KEY || '' }}
        run: |
          "$RUNNER_TEMP/colab-control/bin/python" clipforge-source/tools/colab_actions.py run
      - name: Run two owned ASR runtimes and merge before topic allocation
        timeout-minutes: 110
        if: steps.request.outputs.asr_parts == '2'
        env:
          GH_TOKEN: ${{ github.token }}
          COLAB_ADC_JSON: ${{ secrets.COLAB_ADC_JSON }}
          CLIPFORGE_COLAB_SHAPE: ${{ inputs.shape }}
          CLIPFORGE_PUBLIC_CACHE: ${{ inputs.public_cache || 'off' }}
        run: |
          clipforge-source/.venv/bin/python clipforge-source/tools/split_asr_job.py \
            --directory "$RUNNER_TEMP/clipforge-input" --output "$RUNNER_TEMP/clipforge-out" \
            --control-python "$RUNNER_TEMP/colab-control/bin/python" \
            --state-root "$RUNNER_TEMP/clipforge-split"
      - name: Release and verify removal of the dedicated Colab runtime
        timeout-minutes: 10
        if: always() && steps.control.outcome == 'success'
        run: |
          failed=0
          for state in "$RUNNER_TEMP/clipforge-colab-control" "$RUNNER_TEMP/clipforge-split/control-0" "$RUNNER_TEMP/clipforge-split/control-1"; do
            if [ -f "$state/state.json" ]; then
              "$RUNNER_TEMP/colab-control/bin/python" clipforge-source/tools/colab_actions.py stop --state-dir "$state" || failed=1
            fi
          done
          exit "$failed"
      - name: Keep available ASR part outputs privately after split failure
        timeout-minutes: 10
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: clipforge-partial-${{ inputs.request_id }}
          path: ${{ runner.temp }}/clipforge-split/result-*/
          retention-days: 7
          if-no-files-found: ignore
      - name: Delete temporary private ASR part releases
        timeout-minutes: 10
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" != true ]; then exit 1; fi
          mapfile -t tags < <(python3 - <<'PY'
          import hashlib, os, re
          parent = os.environ['REQUEST_ID']
          assert re.fullmatch(r'[a-f0-9]{32}', parent)
          for index in (0, 1):
              identity = hashlib.sha256(f'clipforge-asr-part-v1:{parent}:{index}'.encode()).hexdigest()[:32]
              print('clipforge-input-' + identity)
          PY
          )
          failed=0
          for tag in "${tags[@]}"; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || failed=1
            fi
          done
          if [ "$failed" = 1 ]; then echo '::warning::Temporary private ASR part input cleanup failed.'; fi
          exit "$failed"
      - uses: actions/upload-artifact@v4
        timeout-minutes: 10
        if: always()
        with:
          name: clipforge-${{ inputs.auto_previews && 'analysis' || 'result' }}-${{ inputs.request_id }}
          path: ${{ runner.temp }}/clipforge-out/
          compression-level: 0
          retention-days: 7
          if-no-files-found: warn
      - name: Delete temporary private input and result transfer chunks
        id: input-cleanup
        timeout-minutes: 10
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        # Uses only the preinstalled gh, so cleanup still runs when checkout or setup failed.
        run: |
          if ! [[ $INPUT_TAG =~ ^clipforge-input-[a-f0-9]{32}$ ]]; then
            echo 'Unexpected temporary input tag; nothing was deleted.' >&2
            exit 1
          fi
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" != true ]; then
            echo 'The worker repository must remain private; nothing was deleted.' >&2
            exit 1
          fi
          if gh release view "$INPUT_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$INPUT_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            echo 'Temporary private input release deleted.'
          else
            echo 'No temporary private input release remains.'
          fi
      - name: Report a temporary input that could not be deleted
        timeout-minutes: 5
        if: always() && steps.input-cleanup.outcome != 'success'
        run: |
          echo "::warning title=Temporary private input remains::$INPUT_TAG may still hold private input. Delete it with tools/submit_job.py --cleanup-tag $INPUT_TAG."
          {
            echo '### Temporary private input remains'
            echo "The release \`$INPUT_TAG\` could not be confirmed deleted. Delete it with \`tools/submit_job.py --cleanup-tag $INPUT_TAG\`."
          } >> "$GITHUB_STEP_SUMMARY"

  url-probe:
    if: github.repository == 'nyu1791-collab/ai-model-workers' && github.event.repository.private && inputs.probe_only
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      SOURCE_REF: ${{ inputs.source_ref }}
      REQUEST_ID: ${{ inputs.request_id }}
      AUDIO_URL: ${{ inputs.audio_url }}
    steps:
      - name: Validate metadata probe input
        timeout-minutes: 1
        run: |
          python3 - <<'PY'
          import os, re
          from urllib.parse import urlsplit
          assert re.fullmatch(r'[a-f0-9]{40}', os.environ['SOURCE_REF'])
          assert urlsplit(os.environ['AUDIO_URL']).scheme == 'https'
          PY
      - uses: actions/checkout@v4
        timeout-minutes: 2
        with:
          repository: nyu1791-collab/ClipForge
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        timeout-minutes: 2
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        timeout-minutes: 2
        with:
          version: '0.12.23'
          enable-cache: false
      - uses: actions/setup-node@v4
        timeout-minutes: 2
        with:
          node-version: '22.23.3'
      - name: Install locked metadata dependencies without credentials
        timeout-minutes: 3
        run: uv sync --locked --extra media-fetch --no-dev
      - name: Prepare hash-locked YouTube dependencies and immutable Docker provider
        timeout-minutes: 8
        run: uv run --no-sync python tools/youtube_transport.py prepare --state-dir "$RUNNER_TEMP/clipforge-youtube" --url "$AUDIO_URL"
      - name: Probe Docker provider with web,mweb before WARP
        timeout-minutes: 6
        run: uv run --no-sync python tools/probe_youtube_pot.py --url "$AUDIO_URL" --network direct --output probe-result/docker-direct.json
      - name: Connect pinned WARP and reset the owned provider
        id: warp
        continue-on-error: true
        timeout-minutes: 6
        run: uv run --no-sync python tools/youtube_transport.py connect --state-dir "$RUNNER_TEMP/clipforge-youtube" --url "$AUDIO_URL"
      - name: Probe Docker provider with web,mweb through verified WARP
        if: steps.warp.outcome == 'success'
        timeout-minutes: 6
        run: uv run --no-sync python tools/probe_youtube_pot.py --url "$AUDIO_URL" --network warp --output probe-result/docker-warp.json
      - name: Verify actual audio acquisition through WARP without allocating a GPU
        id: audio_probe
        if: steps.warp.outcome == 'success'
        timeout-minutes: 15
        run: |
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          uv run --no-sync python tools/probe_youtube_audio.py --url "$AUDIO_URL" --directory "$RUNNER_TEMP/clipforge-audio-probe"
      - name: Verify WARP disconnect and remove only the owned provider
        id: transport_close
        timeout-minutes: 2
        if: always()
        run: uv run --no-sync python tools/youtube_transport.py cleanup --state-dir "$RUNNER_TEMP/clipforge-youtube"
      - name: Verify audio reuse after the network transport is closed
        if: steps.audio_probe.outputs.audio_acquired == 'true' && steps.transport_close.outcome == 'success'
        timeout-minutes: 2
        run: uv run --no-sync python tools/probe_youtube_reuse.py --url "$AUDIO_URL" --directory "$RUNNER_TEMP/clipforge-audio-probe" --output "$RUNNER_TEMP/clipforge-audio-reuse"
      - name: Keep verified audio privately for subsequent ASR
        if: always() && steps.audio_probe.outputs.audio_acquired == 'true'
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: clipforge-verified-audio-${{ inputs.request_id }}
          path: |
            ${{ runner.temp }}/clipforge-audio-probe/audio.m4a
            ${{ runner.temp }}/clipforge-audio-probe/audio-source.json
          retention-days: 7
          compression-level: 0
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        timeout-minutes: 2
        if: always()
        with:
          name: clipforge-url-probe-${{ github.run_id }}
          path: |
            probe-result/
            ${{ runner.temp }}/clipforge-youtube/
          retention-days: 7
          if-no-files-found: warn

  previews:
    needs: colab-auto
    if: github.repository == 'nyu1791-collab/ai-model-workers' && github.event.repository.private && inputs.auto_previews && needs.colab-auto.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CLIPFORGE_SOURCE_REF: ${{ inputs.source_ref }}
      REQUEST_ID: ${{ inputs.request_id }}
      CPU_PACKAGES: ffmpeg fontconfig fonts-noto-cjk libcairo2
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 10
        with:
          repository: nyu1791-collab/ClipForge
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        timeout-minutes: 10
        with:
          python-version: '3.11'
      - name: Install pinned uv
        timeout-minutes: 10
        run: python -m pip install uv==0.12.23
      - name: Prepare CPU package cache
        timeout-minutes: 10
        id: debs
        run: |
          mkdir -p "$RUNNER_TEMP/clipforge-debs"
          package_hash=$(printf '%s' "$CPU_PACKAGES" | sha256sum | cut -d' ' -f1)
          printf 'key=debs-%s-%s-%s\n' "$ImageOS" "$ImageVersion" "$package_hash" >> "$GITHUB_OUTPUT"
      - name: Restore CPU package archives
        timeout-minutes: 10
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/clipforge-debs/*.deb
          key: ${{ steps.debs.outputs.key }}
      - name: Install missing CPU media tools and fonts
        timeout-minutes: 10
        run: |
          missing=()
          for package in $CPU_PACKAGES; do
            if [ "$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null || true)" != 'install ok installed' ]; then
              missing+=("$package")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            cache="$RUNNER_TEMP/clipforge-debs"
            options=(-y --no-install-recommends -o "Dir::Cache::archives=$cache" -o APT::Keep-Downloaded-Packages=true)
            if ! sudo apt-get install --no-download "${options[@]}" "${missing[@]}"; then
              sudo apt-get update -qq
              sudo apt-get install "${options[@]}" "${missing[@]}"
            fi
          fi
      - name: Install Python stage dependencies
        timeout-minutes: 10
        run: uv sync --locked --extra media-fetch --no-dev
      - uses: actions/download-artifact@v4
        timeout-minutes: 10
        with:
          name: clipforge-analysis-${{ inputs.request_id }}
          path: ${{ runner.temp }}/clipforge-analysis
      - name: Prepare the submitted preview settings
        timeout-minutes: 10
        env:
          SETTINGS_JSON: ${{ inputs.settings_json }}
        run: |
          uv run --no-sync python - <<'PY'
          import json, os
          from pathlib import Path
          from tools.submit_job import parse_settings_json
          settings = parse_settings_json(os.environ['SETTINGS_JSON'])
          path = Path(os.environ['RUNNER_TEMP']) / 'preview-settings.json'
          path.write_text(json.dumps(settings))
          path.chmod(0o600)
          PY
      - name: Verify this run's analysis and create previews and an unapproved draft
        timeout-minutes: 60
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: |
          uv run --no-sync python tools/run_audio_stage.py --stage previews \
            --same-run-analysis "$RUNNER_TEMP/clipforge-analysis" \
            --previous-run "$GITHUB_RUN_ID" --previous-request "$REQUEST_ID" \
            --request-id "$REQUEST_ID" --source-ref "$CLIPFORGE_SOURCE_REF" \
            --config "$RUNNER_TEMP/preview-settings.json" --output "$RUNNER_TEMP/clipforge-previews"
      - uses: actions/upload-artifact@v4
        timeout-minutes: 10
        if: always()
        with:
          name: clipforge-result-${{ inputs.request_id }}
          path: ${{ runner.temp }}/clipforge-previews/
          compression-level: 0
          retention-days: 7
          if-no-files-found: warn
