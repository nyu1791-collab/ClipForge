name: ClipForge
run-name: ClipForge ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: VM-generated request identifier (32 lowercase hex characters)
        type: string
        required: true
      input_tag:
        description: Temporary private input release tag
        type: string
        required: true
      source_ref:
        description: Exact reviewed ClipForge commit SHA
        type: string
        required: true
      worker:
        description: Automatic Colab T4 or explicit CPU
        type: choice
        options: [colab-auto, cpu]
        default: colab-auto
      shape:
        description: Colab runtime shape for colab-auto (high-ram has 8 CPU cores and 51 GB)
        type: choice
        options: [high-ram, standard]
        default: high-ram
      audio_url:
        description: Canonical Kick VOD URL for URL-only audio analysis on colab-auto
        type: string
        default: ''
      settings_json:
        description: URL-only audio analysis settings JSON (at most 16 KB)
        type: string
        default: '{}'
      auto_previews:
        description: Continue URL-only analysis with CPU previews and an unapproved review draft
        type: boolean
        default: false
      public_cache:
        description: Restore and publish the GPU public cache on colab-auto (off by default, since a fresh setup took 40 s versus 104 s with the cache)
        type: choice
        options: ['on', 'off']
        default: 'off'

permissions:
  contents: write
  actions: read

# Each colab-auto job owns its own T4, so those run side by side (the account grants two).
# Hosted CPU jobs share one group and run one at a time.
concurrency:
  group: ${{ inputs.worker == 'colab-auto' && format('clipforge-colab-{0}', inputs.request_id) || 'clipforge-video' }}
  cancel-in-progress: false

jobs:
  clip:
    if: github.repository == 'nyu1791-collab/ai-model-workers' && inputs.worker == 'cpu'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CLIPFORGE_SOURCE_REF: ${{ inputs.source_ref }}
      INPUT_TAG: ${{ inputs.input_tag }}
      REQUEST_ID: ${{ inputs.request_id }}
      PYTHONUNBUFFERED: '1'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      CLIPFORGE_REQUIRE_CUDA: '0'
    steps:
      - name: Validate request identifiers
        timeout-minutes: 10
        env:
          AUTO_PREVIEWS: ${{ inputs.auto_previews }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r'[a-f0-9]{32}', os.environ['REQUEST_ID'])
          assert re.fullmatch(r'[a-f0-9]{40}', os.environ['CLIPFORGE_SOURCE_REF'])
          assert os.environ['INPUT_TAG'] == 'clipforge-input-' + os.environ['REQUEST_ID']
          assert os.environ['AUTO_PREVIEWS'] != 'true', 'auto_previews requires colab-auto and audio_url'
          PY
      - uses: actions/checkout@v4
        timeout-minutes: 10
        with:
          repository: nyu1791-collab/ClipForge
          ref: ${{ inputs.source_ref }}
          path: clipforge-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        timeout-minutes: 10
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        timeout-minutes: 10
        with:
          version: '0.12.23'
          enable-cache: false
      - name: Install media tools and Japanese fonts
        timeout-minutes: 10
        run: |
          if [ "$(id -u)" = 0 ]; then APT=(apt-get); else APT=(sudo apt-get); fi
          "${APT[@]}" update -qq
          "${APT[@]}" install -y --no-install-recommends ffmpeg fontconfig fonts-noto-cjk gh libcairo2
      - name: Install locked Python dependencies without API credentials
        timeout-minutes: 10
        working-directory: clipforge-source
        shell: bash
        run: |
          uv sync --locked --extra chat --no-dev
      - name: Download and validate temporary private input
        timeout-minutes: 10
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          clipforge-source/.venv/bin/python clipforge-source/tools/run_request.py prepare \
            --tag "$INPUT_TAG" --directory "$RUNNER_TEMP/clipforge-input"
      - uses: actions/cache/restore@v4
        timeout-minutes: 10
        id: stages
        with:
          key: clipforge-stages-v1-${{ steps.prepare.outputs.cache_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: clipforge-stages-v1-${{ steps.prepare.outputs.cache_key }}-
          path: |
            ${{ runner.temp }}/clipforge-out/input.json
            ${{ runner.temp }}/clipforge-out/transcript.json
            ${{ runner.temp }}/clipforge-out/scenes.json
            ${{ runner.temp }}/clipforge-out/chat.json
            ${{ runner.temp }}/clipforge-out/candidates.json
            ${{ runner.temp }}/clipforge-out/selection.json
            ${{ runner.temp }}/clipforge-out/.state
      - name: Run the requested ClipForge stage (audio analysis makes no model calls)
        timeout-minutes: 80
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          clipforge-source/.venv/bin/python clipforge-source/tools/run_request.py run \
            --tag "$INPUT_TAG" --directory "$RUNNER_TEMP/clipforge-input" \
            --output "$RUNNER_TEMP/clipforge-out"
      - name: Keep partial transcript privately after failure, timeout or cancellation
        timeout-minutes: 10
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: clipforge-partial-${{ inputs.request_id }}
          path: ${{ runner.temp }}/clipforge-out/transcripts/*.partial.jsonl
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/cache/save@v4
        timeout-minutes: 10
        if: always() && steps.prepare.outcome == 'success'
        continue-on-error: true
        with:
          key: ${{ steps.stages.outputs.cache-primary-key }}
          path: |
            ${{ runner.temp }}/clipforge-out/input.json
            ${{ runner.temp }}/clipforge-out/transcript.json
            ${{ runner.temp }}/clipforge-out/scenes.json
            ${{ runner.temp }}/clipforge-out/chat.json
            ${{ runner.temp }}/clipforge-out/candidates.json
            ${{ runner.temp }}/clipforge-out/selection.json
            ${{ runner.temp }}/clipforge-out/.state
      - uses: actions/upload-artifact@v4
        timeout-minutes: 10
        if: always()
        with:
          name: clipforge-result-${{ inputs.request_id }}
          path: ${{ runner.temp }}/clipforge-out/
          compression-level: 0
          retention-days: 7
          if-no-files-found: warn
      - name: Delete temporary private input
        timeout-minutes: 10
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -x clipforge-source/.venv/bin/python ]; then
            clipforge-source/.venv/bin/python clipforge-source/tools/run_request.py cleanup --tag "$INPUT_TAG"
          else
            echo 'Input cleanup could not run; inspect the private release before resubmitting.'
            exit 1
          fi

  colab-auto:
    if: github.repository == 'nyu1791-collab/ai-model-workers' && inputs.worker == 'colab-auto'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CLIPFORGE_SOURCE_REF: ${{ inputs.source_ref }}
      INPUT_TAG: ${{ inputs.input_tag }}
      REQUEST_ID: ${{ inputs.request_id }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Validate request and one-time Colab OAuth setup
        timeout-minutes: 10
        env:
          COLAB_ADC_JSON: ${{ secrets.COLAB_ADC_JSON }}
          AUDIO_URL: ${{ inputs.audio_url }}
          AUTO_PREVIEWS: ${{ inputs.auto_previews }}
        run: |
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r'[a-f0-9]{32}', os.environ['REQUEST_ID'])
          assert re.fullmatch(r'[a-f0-9]{40}', os.environ['CLIPFORGE_SOURCE_REF'])
          assert os.environ['INPUT_TAG'] == 'clipforge-input-' + os.environ['REQUEST_ID']
          assert os.environ['AUTO_PREVIEWS'] != 'true' or os.environ['AUDIO_URL']
          if os.environ['AUDIO_URL']:
              assert re.fullmatch(r'https://kick\.com/[A-Za-z0-9_-]+/videos/[0-9a-fA-F]{8}(?:-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}', os.environ['AUDIO_URL'])
          if not os.environ.get('COLAB_ADC_JSON'):
              raise SystemExit('COLAB_ADC_JSON is missing. Authorize n.yu17919191@gmail.com once; no GPU was allocated.')
          PY
      - uses: actions/checkout@v4
        timeout-minutes: 10
        with:
          repository: nyu1791-collab/ClipForge
          ref: ${{ inputs.source_ref }}
          path: clipforge-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        timeout-minutes: 10
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        timeout-minutes: 10
        with:
          version: '0.12.23'
          enable-cache: true
          cache-dependency-glob: clipforge-source/tools/colab-control-requirements.txt
      - name: Install the locked Google Colab control SDK without ASR or CUDA packages
        timeout-minutes: 10
        id: control
        run: |
          uv venv "$RUNNER_TEMP/colab-control" --python 3.12
          uv pip install --python "$RUNNER_TEMP/colab-control/bin/python" --require-hashes \
            -r clipforge-source/tools/colab-control-requirements.txt
      - name: Install locked audio acquisition dependencies without API credentials
        timeout-minutes: 10
        if: inputs.audio_url != ''
        working-directory: clipforge-source
        run: uv sync --locked --extra media-fetch --no-dev
      - name: Acquire audio and stage verified private input before GPU allocation
        timeout-minutes: 30
        if: inputs.audio_url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIO_URL: ${{ inputs.audio_url }}
          SETTINGS_JSON: ${{ inputs.settings_json }}
        run: |
          gh release create "$INPUT_TAG" --repo "$GITHUB_REPOSITORY" --target main \
            --title "$INPUT_TAG" --latest=false \
            --notes 'Temporary private ClipForge URL input. Automatically cleaned after execution.'
          clipforge-source/.venv/bin/python clipforge-source/tools/acquire_audio_url.py \
            --url "$AUDIO_URL" --request-id "$REQUEST_ID" --source-ref "$CLIPFORGE_SOURCE_REF" \
            --settings-json "$SETTINGS_JSON" \
            --directory "$RUNNER_TEMP/clipforge-input"
          gh release upload "$INPUT_TAG" --repo "$GITHUB_REPOSITORY" \
            "$RUNNER_TEMP/clipforge-input/input-video.bin" \
            "$RUNNER_TEMP/clipforge-input/request.json"
      - name: Identify model API requirements from the staged request
        timeout-minutes: 10
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$INPUT_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern request.json --dir "$RUNNER_TEMP/clipforge-model-request"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          request = json.loads((Path(os.environ['RUNNER_TEMP']) / 'clipforge-model-request/request.json').read_text())
          assert request['request_id'] == os.environ['REQUEST_ID']
          assert request['source_ref'] == os.environ['CLIPFORGE_SOURCE_REF']
          no_model_api = '1' if request.get('audio_source_url') else '0'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'no_model_api={no_model_api}\n')
          PY
      - name: Allocate a dedicated T4 for the verified Google account
        timeout-minutes: 20
        id: allocate
        env:
          COLAB_ADC_JSON: ${{ secrets.COLAB_ADC_JSON }}
          CLIPFORGE_COLAB_SHAPE: ${{ inputs.shape }}
          CLIPFORGE_PUBLIC_CACHE: ${{ inputs.public_cache || 'off' }}
        run: |
          "$RUNNER_TEMP/colab-control/bin/python" clipforge-source/tools/colab_actions.py start
      - name: Run the pipeline on Colab and retrieve verified private outputs
        timeout-minutes: 90
        env:
          GH_TOKEN: ${{ github.token }}
          CLIPFORGE_NO_MODEL_API: ${{ steps.request.outputs.no_model_api }}
          GEMINI_API_KEY: ${{ steps.request.outputs.no_model_api == '0' && secrets.GEMINI_API_KEY || '' }}
        run: |
          "$RUNNER_TEMP/colab-control/bin/python" clipforge-source/tools/colab_actions.py run
      - name: Release and verify removal of the dedicated Colab runtime
        timeout-minutes: 10
        if: always() && steps.control.outcome == 'success'
        run: |
          "$RUNNER_TEMP/colab-control/bin/python" clipforge-source/tools/colab_actions.py stop
      - uses: actions/upload-artifact@v4
        timeout-minutes: 10
        if: always()
        with:
          name: clipforge-${{ inputs.auto_previews && 'analysis' || 'result' }}-${{ inputs.request_id }}
          path: ${{ runner.temp }}/clipforge-out/
          compression-level: 0
          retention-days: 7
          if-no-files-found: warn
      - name: Delete temporary private input and result transfer chunks
        timeout-minutes: 10
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f clipforge-source/tools/run_request.py ]; then
            python3 clipforge-source/tools/run_request.py cleanup --tag "$INPUT_TAG"
          else
            echo 'Input cleanup could not run; inspect the private input release before resubmitting.'
          fi

  previews:
    needs: colab-auto
    if: github.repository == 'nyu1791-collab/ai-model-workers' && github.event.repository.private && inputs.auto_previews && needs.colab-auto.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CLIPFORGE_SOURCE_REF: ${{ inputs.source_ref }}
      REQUEST_ID: ${{ inputs.request_id }}
      CPU_PACKAGES: ffmpeg fontconfig fonts-noto-cjk libcairo2
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 10
        with:
          repository: nyu1791-collab/ClipForge
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        timeout-minutes: 10
        with:
          python-version: '3.11'
      - name: Install pinned uv
        timeout-minutes: 10
        run: python -m pip install uv==0.12.23
      - name: Prepare CPU package cache
        timeout-minutes: 10
        id: debs
        run: |
          mkdir -p "$RUNNER_TEMP/clipforge-debs"
          package_hash=$(printf '%s' "$CPU_PACKAGES" | sha256sum | cut -d' ' -f1)
          printf 'key=debs-%s-%s-%s\n' "$ImageOS" "$ImageVersion" "$package_hash" >> "$GITHUB_OUTPUT"
      - name: Restore CPU package archives
        timeout-minutes: 10
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/clipforge-debs/*.deb
          key: ${{ steps.debs.outputs.key }}
      - name: Install missing CPU media tools and fonts
        timeout-minutes: 10
        run: |
          missing=()
          for package in $CPU_PACKAGES; do
            if [ "$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null || true)" != 'install ok installed' ]; then
              missing+=("$package")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            cache="$RUNNER_TEMP/clipforge-debs"
            options=(-y --no-install-recommends -o "Dir::Cache::archives=$cache" -o APT::Keep-Downloaded-Packages=true)
            if ! sudo apt-get install --no-download "${options[@]}" "${missing[@]}"; then
              sudo apt-get update -qq
              sudo apt-get install "${options[@]}" "${missing[@]}"
            fi
          fi
      - name: Install Python stage dependencies
        timeout-minutes: 10
        run: uv sync --locked --extra media-fetch --no-dev
      - uses: actions/download-artifact@v4
        timeout-minutes: 10
        with:
          name: clipforge-analysis-${{ inputs.request_id }}
          path: ${{ runner.temp }}/clipforge-analysis
      - name: Prepare the submitted preview settings
        timeout-minutes: 10
        env:
          SETTINGS_JSON: ${{ inputs.settings_json }}
        run: |
          uv run --no-sync python - <<'PY'
          import json, os
          from pathlib import Path
          from tools.submit_job import parse_settings_json
          settings = parse_settings_json(os.environ['SETTINGS_JSON'])
          path = Path(os.environ['RUNNER_TEMP']) / 'preview-settings.json'
          path.write_text(json.dumps(settings))
          path.chmod(0o600)
          PY
      - name: Verify this run's analysis and create previews and an unapproved draft
        timeout-minutes: 60
        run: |
          uv run --no-sync python tools/run_audio_stage.py --stage previews \
            --same-run-analysis "$RUNNER_TEMP/clipforge-analysis" \
            --previous-run "$GITHUB_RUN_ID" --previous-request "$REQUEST_ID" \
            --request-id "$REQUEST_ID" --source-ref "$CLIPFORGE_SOURCE_REF" \
            --config "$RUNNER_TEMP/preview-settings.json" --output "$RUNNER_TEMP/clipforge-previews"
      - uses: actions/upload-artifact@v4
        timeout-minutes: 10
        if: always()
        with:
          name: clipforge-result-${{ inputs.request_id }}
          path: ${{ runner.temp }}/clipforge-previews/
          compression-level: 0
          retention-days: 7
          if-no-files-found: warn
