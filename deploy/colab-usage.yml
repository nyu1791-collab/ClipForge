name: Colab compute units (read-only)

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact reviewed ClipForge commit SHA
        type: string
        required: true

permissions:
  contents: read

jobs:
  usage:
    if: github.repository == 'nyu1791-collab/ai-model-workers'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate the source revision
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          python3 -c "import os, re; assert re.fullmatch(r'[a-f0-9]{40}', os.environ['SOURCE_REF'])"
      - uses: actions/checkout@v4
        with:
          repository: nyu1791-collab/ClipForge
          ref: ${{ inputs.source_ref }}
          path: clipforge-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          enable-cache: true
          cache-dependency-glob: clipforge-source/tools/colab-control-requirements.txt
      - name: Install the locked control SDK
        run: |
          uv venv "$RUNNER_TEMP/colab-control" --python 3.12
          uv pip install --python "$RUNNER_TEMP/colab-control/bin/python" --require-hashes \
            -r clipforge-source/tools/colab-control-requirements.txt
      - name: Read the balance without allocating any runtime
        env:
          COLAB_ADC_JSON: ${{ secrets.COLAB_ADC_JSON }}
        run: |
          "$RUNNER_TEMP/colab-control/bin/python" clipforge-source/tools/colab_actions.py doctor
