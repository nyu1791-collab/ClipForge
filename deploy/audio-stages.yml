{
  "name": "ClipForge audio-first stages",
  "run-name": "ClipForge ${{ inputs.request_id }}",
  "permissions": {
    "contents": "write",
    "actions": "read"
  },
  "concurrency": {
    "group": "${{ (inputs.audio_stage == 'understanding' || inputs.worker == 'colab-auto') && format('clipforge-production-{0}', inputs.request_id) || 'clipforge-video' }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "audio-stage": {
      "if": "github.repository == 'nyu1791-collab/ClipForge' && inputs.worker == 'cpu' && inputs.audio_stage != 'understanding'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 90,
      "env": {
        "SOURCE_REF": "${{ inputs.source_ref }}",
        "REQUEST_ID": "${{ inputs.request_id }}",
        "INPUT_TAG": "${{ inputs.input_tag }}",
        "AUDIO_STAGE": "${{ inputs.audio_stage }}",
        "PREVIOUS_RUN": "${{ inputs.previous_run_id }}",
        "PREVIOUS_REQUEST": "${{ inputs.previous_request_id }}",
        "REVIEW_JSON": "${{ inputs.review_json }}",
        "CLIP_INDEX": "${{ inputs.clip_index }}",
        "PART_RUNS": "${{ inputs.part_runs }}",
        "CONFIG_FILE": "${{ inputs.config_file }}",
        "CPU_PACKAGES": "ffmpeg fontconfig fonts-noto-cjk libcairo2",
        "PYTHONUNBUFFERED": "1",
        "CLIPFORGE_TOPIC_MODEL": "gemini-3.8-flash",
        "CLIPFORGE_VERTEX_PROJECT": "project-fdadb4dd-cb77-4270-9cd",
        "CLIPFORGE_STORAGE_REPO": "nyu1791-collab/ai-model-workers"
      },
      "steps": [
        {
          "name": "Require private storage credentials before processing",
          "env": {
            "STORE_TOKEN": "${{ secrets.CLIPFORGE_PAT }}",
            "STORE_MODE": "${{ inputs.result_store }}"
          },
          "run": "test -n \"$STORE_TOKEN\" || { echo \"Register CLIPFORGE_PAT in ClipForge secrets.\"; exit 1; }\nif [ -n \"$STORE_MODE\" ] && [ \"$STORE_MODE\" != release ]; then echo \"Public execution supports private Release storage only.\"; exit 1; fi"
        },
        {
          "name": "Use the pinned production source",
          "env": {
            "REQUESTED_SOURCE": "${{ inputs.source_ref }}"
          },
          "run": "[[ \"$REQUESTED_SOURCE\" =~ ^[a-f0-9]{40}$ ]] || exit 1\n",
          "timeout-minutes": 1
        },
        {
          "name": "Validate private stage identities",
          "run": "python3 - <<'PY'\nimport os,re,json,pathlib\nfor key,length in [('SOURCE_REF',40),('REQUEST_ID',32),('PREVIOUS_REQUEST',32)]:\n    assert re.fullmatch('[a-f0-9]{'+str(length)+'}',os.environ[key])\nassert os.environ['INPUT_TAG']=='clipforge-input-'+os.environ['REQUEST_ID']\nassert re.fullmatch('[0-9]{1,20}',os.environ['PREVIOUS_RUN'])\nassert os.environ['AUDIO_STAGE'] in {'previews','render','merge'}\nassert os.environ['CLIP_INDEX']=='' or re.fullmatch('[1-9][0-9]?',os.environ['CLIP_INDEX'])\nparts=os.environ['PART_RUNS']\nassert (os.environ['AUDIO_STAGE']=='merge')==bool(parts)\nassert parts=='' or re.fullmatch(r'[0-9]{1,20}:[a-f0-9]{32}(,[0-9]{1,20}:[a-f0-9]{32}){0,19}',parts)\nassert re.fullmatch(r'config\\.[a-z0-9-]+\\.example\\.json',os.environ['CONFIG_FILE'])\ntext=os.environ['REVIEW_JSON']\nassert len(text.encode())<=60000\nif os.environ['AUDIO_STAGE']=='render':\n    assert text\ntext=text or '{}'\njson.loads(text)\npath=pathlib.Path(os.environ['RUNNER_TEMP'])/'review.json'\npath.write_text(text)\npath.chmod(0o600)\nPY\n"
        },
        {
          "uses": "actions/checkout@v4",
          "with": {
            "repository": "nyu1791-collab/ClipForge",
            "ref": "${{ inputs.source_ref }}",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "name": "Install pinned uv",
          "run": "python -m pip install uv==0.12.23"
        },
        {
          "name": "Prepare CPU package cache",
          "if": "inputs.audio_stage == 'render'",
          "id": "debs",
          "run": "mkdir -p \"$RUNNER_TEMP/clipforge-debs\"\npackage_hash=$(printf '%s' \"$CPU_PACKAGES\" | sha256sum | cut -d' ' -f1)\nprintf 'key=debs-%s-%s-%s\\n' \"$ImageOS\" \"$ImageVersion\" \"$package_hash\" >> \"$GITHUB_OUTPUT\"\n"
        },
        {
          "name": "Restore CPU package archives",
          "if": "inputs.audio_stage == 'render'",
          "uses": "actions/cache@v4",
          "with": {
            "path": "${{ runner.temp }}/clipforge-debs/*.deb",
            "key": "${{ steps.debs.outputs.key }}"
          }
        },
        {
          "name": "Install missing CPU media tools and fonts",
          "timeout-minutes": 10,
          "if": "inputs.audio_stage == 'render'",
          "run": "missing=()\nfor package in $CPU_PACKAGES; do\n  if [ \"$(dpkg-query -W -f='${Status}' \"$package\" 2>/dev/null || true)\" != 'install ok installed' ]; then\n    missing+=(\"$package\")\n  fi\ndone\nif [ \"${#missing[@]}\" -gt 0 ]; then\n  cache=\"$RUNNER_TEMP/clipforge-debs\"\n  options=(-y --no-install-recommends -o \"Dir::Cache::archives=$cache\" -o APT::Keep-Downloaded-Packages=true)\n  if ! sudo apt-get install --no-download \"${options[@]}\" \"${missing[@]}\"; then\n    sudo apt-get update -qq\n    sudo apt-get install \"${options[@]}\" \"${missing[@]}\"\n  fi\nfi\n"
        },
        {
          "name": "Install audio metadata tool only if absent",
          "run": "if ! command -v ffprobe >/dev/null 2>&1; then sudo apt-get update -qq; sudo apt-get install -y --no-install-recommends ffmpeg; fi",
          "if": "inputs.audio_stage == 'previews'"
        },
        {
          "name": "Install Python stage dependencies",
          "run": "if [ \"$AUDIO_STAGE\" = render ]; then uv sync --locked --extra media-fetch --no-dev; else uv sync --locked --no-dev; fi"
        },
        {
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "22"
          },
          "if": "inputs.audio_stage == 'render'"
        },
        {
          "name": "Connect the dedicated Vertex identity",
          "id": "vertex",
          "uses": "google-github-actions/auth@v3",
          "with": {
            "workload_identity_provider": "projects/${{ vars.CLIPFORGE_VERTEX_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/clipforge-actions/providers/github",
            "service_account": "clipforge-vertex@project-fdadb4dd-cb77-4270-9cd.iam.gserviceaccount.com",
            "token_format": "access_token",
            "access_token_lifetime": "900s",
            "access_token_scopes": "https://www.googleapis.com/auth/cloud-platform",
            "create_credentials_file": false,
            "export_environment_variables": false
          },
          "if": "inputs.audio_stage == 'previews'"
        },
        {
          "name": "Execute the requested stage with saved ASR",
          "env": {
            "YOUTUBE_COOKIES_B64": "${{ secrets.YOUTUBE_COOKIES_B64 }}",
            "GH_TOKEN": "${{ secrets.CLIPFORGE_PAT }}",
            "CLIPFORGE_VERTEX_ACCESS_TOKEN": "${{ steps.vertex.outputs.access_token }}"
          },
          "run": "if [ \"$AUDIO_STAGE\" = merge ]; then\n  # The clip renders are verified private artifacts; merge checks every hash again.\n  uv run --no-sync python tools/run_audio_stage.py --stage merge \\\n    --part-runs \"$PART_RUNS\" --previous-request \"$PREVIOUS_REQUEST\" \\\n    --request-id \"$REQUEST_ID\" --source-ref \"$SOURCE_REF\" --output artifacts/audio-stage \\\n    --config \"$CONFIG_FILE\"\nelse\n  set -- --previous-run \"$PREVIOUS_RUN\" --previous-request \"$PREVIOUS_REQUEST\" \\\n    --request-id \"$REQUEST_ID\" --source-ref \"$SOURCE_REF\" \\\n    --review-file \"$RUNNER_TEMP/review.json\" --output artifacts/audio-stage \\\n    --config \"$CONFIG_FILE\"\n  if [ -n \"$CLIP_INDEX\" ]; then set -- \"$@\" --clip-index \"$CLIP_INDEX\"; fi\n  uv run --no-sync python tools/run_audio_stage.py --stage \"$AUDIO_STAGE\" \"$@\"\nfi\n"
        },
        {
          "name": "Save private stage output",
          "if": "always() && inputs.result_store == 'release'",
          "timeout-minutes": 10,
          "env": {
            "GH_TOKEN": "${{ secrets.CLIPFORGE_PAT }}",
            "PYTHONPATH": "${{ github.workspace }}/src",
            "RESULT_DIRECTORY": "${{ github.workspace }}/artifacts/audio-stage",
            "RESULT_NAME": "clipforge-result-${{ inputs.request_id }}"
          },
          "run": "python3 -m clipforge.release_transfer publish \"$RESULT_DIRECTORY\" \"$RESULT_NAME\""
        },
        {
          "name": "Keep Gemini failure timing without another generation",
          "if": "failure()",
          "env": {
            "GH_TOKEN": "${{ secrets.CLIPFORGE_PAT }}"
          },
          "run": "receipt=\"artifacts/audio-stage/vertex-selection-receipt.json\"\nif [ -f \"$receipt\" ]; then\n  gh release create \"clipforge-vertex-failure-$GITHUB_RUN_ID\" \"$receipt\" --repo \"$CLIPFORGE_STORAGE_REPO\" --latest=false --title \"Gemini failure $GITHUB_RUN_ID\" --notes 'One attempt; no retry. Private timing and usage record.'\nfi\n"
        }
      ],
      "permissions": {
        "contents": "write",
        "actions": "read",
        "id-token": "write"
      }
    },
    "colab-render": {
      "if": "github.repository == 'nyu1791-collab/ClipForge' && inputs.worker == 'colab-auto' && inputs.audio_stage != 'understanding'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 100,
      "env": {
        "CLIPFORGE_SOURCE_REF": "${{ inputs.source_ref }}",
        "REQUEST_ID": "${{ inputs.request_id }}",
        "INPUT_TAG": "${{ inputs.input_tag }}",
        "AUDIO_STAGE": "${{ inputs.audio_stage }}",
        "PREVIOUS_RUN": "${{ inputs.previous_run_id }}",
        "PREVIOUS_REQUEST": "${{ inputs.previous_request_id }}",
        "CLIP_INDEX": "${{ inputs.clip_index }}",
        "REVIEW_JSON": "${{ inputs.review_json }}",
        "CONFIG_FILE": "${{ inputs.config_file }}",
        "PYTHONUNBUFFERED": "1",
        "CLIPFORGE_PUBLIC_CACHE": "off",
        "RESULT_STORE": "${{ inputs.result_store }}",
        "CLIPFORGE_STORAGE_REPO": "nyu1791-collab/ai-model-workers",
        "CLIPFORGE_AUDIO_REVIEW_RELEASE": "${{ inputs.editorial_release }}",
        "CLIPFORGE_RESUME_RENDER": "${{ inputs.resume_render }}",
        "CLIPFORGE_APPROVED_SELECTION_SHA256": "${{ inputs.approved_selection_sha256 }}",
        "CLIPFORGE_APPROVED_TRANSCRIPTS_SHA256": "${{ inputs.approved_transcripts_sha256 }}"
      },
      "steps": [
        {
          "name": "Require storage and GPU connections before downloading",
          "env": {
            "STORE_TOKEN": "${{ secrets.CLIPFORGE_PAT }}",
            "STORE_MODE": "${{ inputs.result_store }}",
            "COLAB_CONNECTION": "${{ secrets.COLAB_ADC_JSON }}"
          },
          "run": "test -n \"$STORE_TOKEN\" || { echo \"Register CLIPFORGE_PAT in ClipForge secrets.\"; exit 1; }\nif [ -n \"$STORE_MODE\" ] && [ \"$STORE_MODE\" != release ]; then echo \"Public execution supports private Release storage only.\"; exit 1; fi\ntest -n \"$COLAB_CONNECTION\" || { echo \"Register COLAB_ADC_JSON using tools/configure_colab_oauth.py before rendering.\"; exit 1; }"
        },
        {
          "name": "Use the pinned production source",
          "env": {
            "REQUESTED_SOURCE": "${{ inputs.source_ref }}"
          },
          "run": "[[ \"$REQUESTED_SOURCE\" =~ ^[a-f0-9]{40}$ ]] || exit 1\n",
          "timeout-minutes": 1
        },
        {
          "uses": "actions/checkout@v4",
          "with": {
            "repository": "nyu1791-collab/ClipForge",
            "ref": "${{ inputs.source_ref }}",
            "path": "clipforge-source",
            "persist-credentials": false
          }
        },
        {
          "name": "Load saved selected-only subtitles for render-only continuation",
          "if": "inputs.editorial_release != ''",
          "env": {
            "GH_TOKEN": "${{ secrets.CLIPFORGE_PAT }}"
          },
          "run": "[[ \"$CLIPFORGE_AUDIO_REVIEW_RELEASE\" =~ ^clipforge-kick-editorial-((replay-)?[0-9]+|revision-[a-f0-9]{32})$ ]] || exit 1\nmkdir -p \"$RUNNER_TEMP/editorial-render\"\ngh release download \"$CLIPFORGE_AUDIO_REVIEW_RELEASE\" --repo nyu1791-collab/ai-model-workers --pattern final-selection.json --pattern selected-transcripts.json --dir \"$RUNNER_TEMP/editorial-render\"\ncp \"$RUNNER_TEMP/editorial-render/final-selection.json\" \"$RUNNER_TEMP/review.json\"\n"
        },
        {
          "name": "Validate the clip render request",
          "run": "python3 - <<'PY'\nimport os,re,json,pathlib,hashlib\nif os.environ['AUDIO_STAGE'] != 'render':\n    raise SystemExit('worker=colab-auto requires audio_stage=render; use worker=cpu for previews or merge')\nfor key,length in [('CLIPFORGE_SOURCE_REF',40),('REQUEST_ID',32),('PREVIOUS_REQUEST',32)]:\n    assert re.fullmatch('[a-f0-9]{'+str(length)+'}',os.environ[key])\nassert os.environ['INPUT_TAG']=='clipforge-input-'+os.environ['REQUEST_ID']\nassert re.fullmatch('[0-9]{1,20}',os.environ['PREVIOUS_RUN'])\nassert os.environ['CLIP_INDEX']=='' or re.fullmatch('[1-9][0-9]?',os.environ['CLIP_INDEX'])\nassert re.fullmatch(r'config\\.[a-z0-9-]+\\.example\\.json',os.environ['CONFIG_FILE'])\ntext=(pathlib.Path(os.environ['RUNNER_TEMP'])/'review.json').read_text() if os.environ.get('CLIPFORGE_AUDIO_REVIEW_RELEASE') else os.environ['REVIEW_JSON']\nassert text and len(text.encode())<=4*1024**2\njson.loads(text)\nfor envname,filename in [(\"CLIPFORGE_APPROVED_SELECTION_SHA256\",\"final-selection.json\"),(\"CLIPFORGE_APPROVED_TRANSCRIPTS_SHA256\",\"selected-transcripts.json\")]:\n    expected=os.environ.get(envname, \"\")\n    if expected:\n        assert re.fullmatch(\"[a-f0-9]{64}\",expected)\n        data=(pathlib.Path(os.environ[\"RUNNER_TEMP\"])/\"editorial-render\"/filename).read_bytes()\n        assert hashlib.sha256(data).hexdigest()==expected\npath=pathlib.Path(os.environ['RUNNER_TEMP'])/'review.json'\npath.write_text(text)\npath.chmod(0o600)\nPY\n"
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "uses": "astral-sh/setup-uv@v6",
          "with": {
            "version": "0.12.23",
            "enable-cache": true,
            "cache-dependency-glob": "clipforge-source/tools/colab-control-requirements.txt"
          }
        },
        {
          "name": "Install the locked Google Colab control SDK",
          "id": "control",
          "run": "uv venv \"$RUNNER_TEMP/colab-control\" --python 3.12\nuv pip install --python \"$RUNNER_TEMP/colab-control/bin/python\" --require-hashes \\\n  -r clipforge-source/tools/colab-control-requirements.txt\n"
        },
        {
          "name": "Create the private transfer release for this clip",
          "env": {
            "GH_TOKEN": "${{ secrets.CLIPFORGE_PAT }}"
          },
          "run": "gh release create \"$INPUT_TAG\" --repo \"$CLIPFORGE_STORAGE_REPO\" --target main \\\n  --title \"$INPUT_TAG\" --latest=false \\\n  --notes 'Temporary private ClipForge clip transfer. Deleted after collection.'\n",
          "if": "inputs.result_store != 'release'"
        },
        {
          "name": "Allocate the cheapest runtime the account grants",
          "env": {
            "COLAB_ADC_JSON": "${{ secrets.COLAB_ADC_JSON }}"
          },
          "run": "REVIEW_FILE=\"$RUNNER_TEMP/review.json\" \"$RUNNER_TEMP/colab-control/bin/python\" \\\n  clipforge-source/tools/colab_actions.py start --mode audio-stage\n"
        },
        {
          "name": "Render on Colab and publish final private outputs",
          "env": {
            "YOUTUBE_COOKIES_B64": "${{ secrets.YOUTUBE_COOKIES_B64 }}",
            "GH_TOKEN": "${{ secrets.CLIPFORGE_PAT }}"
          },
          "run": "\"$RUNNER_TEMP/colab-control/bin/python\" clipforge-source/tools/colab_actions.py run\n"
        },
        {
          "name": "Release and verify removal of the runtime",
          "if": "always() && steps.control.outcome == 'success'",
          "run": "\"$RUNNER_TEMP/colab-control/bin/python\" clipforge-source/tools/colab_actions.py stop\n"
        },
        {
          "name": "Delete the private transfer release",
          "id": "input-cleanup",
          "timeout-minutes": 10,
          "if": "inputs.result_store != 'release' && always()",
          "continue-on-error": true,
          "env": {
            "GH_TOKEN": "${{ secrets.CLIPFORGE_PAT }}"
          },
          "run": "if ! [[ $INPUT_TAG =~ ^clipforge-input-[a-f0-9]{32}$ ]]; then\n  echo 'Unexpected temporary input tag; nothing was deleted.' >&2\n  exit 1\nfi\nif [ \"$(gh api \"repos/$CLIPFORGE_STORAGE_REPO\" --jq .private)\" != true ]; then\n  echo 'The worker repository must remain private; nothing was deleted.' >&2\n  exit 1\nfi\nif gh release view \"$INPUT_TAG\" --repo \"$CLIPFORGE_STORAGE_REPO\" >/dev/null 2>&1; then\n  gh release delete \"$INPUT_TAG\" --repo \"$CLIPFORGE_STORAGE_REPO\" --yes --cleanup-tag\n  echo 'Temporary private transfer release deleted.'\nelse\n  echo 'No temporary private transfer release remains.'\nfi\n"
        },
        {
          "name": "Report a transfer release that could not be deleted",
          "timeout-minutes": 5,
          "if": "always() && inputs.result_store != 'release' && steps.input-cleanup.outcome != 'success'",
          "run": "echo \"::warning title=Temporary private transfer remains::$INPUT_TAG may still hold private data. Delete it with tools/submit_job.py --cleanup-tag $INPUT_TAG.\"\n{\n  echo '### Temporary private transfer remains'\n  echo \"The release \\`$INPUT_TAG\\` could not be confirmed deleted. Delete it with \\`tools/submit_job.py --cleanup-tag $INPUT_TAG\\`.\"\n} >> \"$GITHUB_STEP_SUMMARY\"\n"
        }
      ]
    },
    "audio-understanding": {
      "if": "github.repository == 'nyu1791-collab/ClipForge' && inputs.audio_stage == 'understanding'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 150,
      "env": {
        "PYTHONPATH": "src",
        "PYTHONUNBUFFERED": "1",
        "CLIPFORGE_STORAGE_REPO": "nyu1791-collab/ai-model-workers",
        "CLIPFORGE_TRANSCRIBE_PARALLEL": "${{ vars.CLIPFORGE_TRANSCRIBE_PARALLEL || '1' }}"
      },
      "steps": [
        {
          "name": "Require the connections used by this production",
          "env": {
            "STORE_TOKEN": "${{ secrets.CLIPFORGE_PAT }}",
            "VERTEX_PROJECT_NUMBER": "${{ vars.CLIPFORGE_VERTEX_PROJECT_NUMBER }}",
            "COLAB_CONNECTION": "${{ secrets.COLAB_ADC_JSON }}",
            "EDITORIAL_RELEASE": "${{ inputs.editorial_release }}",
            "CONTINUE_MISSING": "${{ inputs.continue_missing }}",
            "AUTO_RENDER": "${{ inputs.auto_render }}"
          },
          "run": "test -n \"$STORE_TOKEN\" || { echo \"Register CLIPFORGE_PAT in ClipForge secrets.\"; exit 1; }\nif [ -z \"$EDITORIAL_RELEASE\" ] || [ \"$CONTINUE_MISSING\" = true ]; then\n test -n \"$VERTEX_PROJECT_NUMBER\" || { echo \"Register CLIPFORGE_VERTEX_PROJECT_NUMBER; see docs/QUICK_START.md.\"; exit 1; }\nfi\nif [ \"$AUTO_RENDER\" = true ]; then\n test -n \"$COLAB_CONNECTION\" || { echo \"Register COLAB_ADC_JSON using tools/configure_colab_oauth.py before rendering.\"; exit 1; }\nfi"
        },
        {
          "name": "Require the configured public Vertex execution branch",
          "env": {
            "CLIPFORGE_RUN_REF": "${{ github.ref }}"
          },
          "run": "[[ \"$CLIPFORGE_RUN_REF\" == refs/heads/main || \"$CLIPFORGE_RUN_REF\" == refs/heads/fix/pr18-verified-transfer ]] || { echo \"Use main or fix/pr18-verified-transfer for the configured Vertex connection.\"; exit 1; }"
        },
        {
          "name": "Validate pinned source and optional preserved audio identity",
          "env": {
            "SOURCE_REF": "${{ inputs.source_ref }}",
            "SOURCE_URL": "${{ inputs.source_url }}",
            "AUDIO_RUN": "${{ inputs.previous_run_id }}",
            "AUDIO_REQUEST": "${{ inputs.previous_request_id }}"
          },
          "run": "[[ \"$SOURCE_REF\" =~ ^[a-f0-9]{40}$ ]]\nif [ -n \"$AUDIO_RUN\" ]; then [[ \"$AUDIO_RUN\" =~ ^[0-9]{1,20}$ ]] && [[ \"$AUDIO_REQUEST\" =~ ^[a-f0-9]{32}$ ]]; else test -z \"$AUDIO_REQUEST\"; fi"
        },
        {
          "uses": "actions/checkout@v4",
          "with": {
            "repository": "nyu1791-collab/ClipForge",
            "ref": "${{ inputs.source_ref }}",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "uses": "astral-sh/setup-uv@v6",
          "with": {
            "version": "0.12.23",
            "enable-cache": true,
            "cache-dependency-glob": "uv.lock"
          }
        },
        {
          "uses": "FedericoCarboni/setup-ffmpeg@36c6454b5a2348e7794ba2d82a21506605921e3d"
        },
        {
          "name": "Install lightweight editing dependencies",
          "timeout-minutes": 6,
          "run": "uv sync --locked --no-dev --extra media-fetch"
        },
        {
          "name": "Install the locked Colab control SDK for selected GPU ASR",
          "id": "asr-control",
          "run": "uv venv \"$RUNNER_TEMP/colab-control\" --python 3.12\nuv pip install --python \"$RUNNER_TEMP/colab-control/bin/python\" --require-hashes -r tools/colab-control-requirements.txt\n"
        },
        {
          "name": "Prepare Node for YouTube acquisition",
          "uses": "actions/setup-node@v4",
          "if": "contains(inputs.source_url, 'youtube.com/') || contains(inputs.source_url, 'youtu.be/')",
          "with": {
            "node-version": "22"
          }
        },
        {
          "name": "Reuse original audio or acquire audio only; no ASR",
          "env": {
            "GH_TOKEN": "${{ secrets.CLIPFORGE_PAT }}",
            "YOUTUBE_COOKIES_B64": "${{ secrets.YOUTUBE_COOKIES_B64 }}",
            "ANALYSIS_RUN": "${{ inputs.analysis_run_id }}",
            "ANALYSIS_REQUEST": "${{ inputs.analysis_request_id }}",
            "SOURCE_URL": "${{ inputs.source_url }}",
            "AUDIO_RUN": "${{ inputs.previous_run_id }}",
            "AUDIO_REQUEST": "${{ inputs.previous_request_id }}"
          },
          "run": "if [ -n \"$AUDIO_RUN\" ]; then\n .venv/bin/python -m clipforge.release_transfer download \"$AUDIO_RUN\" \"clipforge-result-$AUDIO_REQUEST\" \"$RUNNER_TEMP/analysis\"\n .venv/bin/python - <<'PYCODE'\nimport json,os,pathlib\np=pathlib.Path(os.environ['RUNNER_TEMP'])/'analysis'\nassert json.loads((p/'manifest.json').read_text())['source_url']==os.environ['SOURCE_URL']\nassert (p/'audio.m4a').is_file()\nPYCODE\nelse\n .venv/bin/python -m clipforge.audio_understanding acquire --url \"$SOURCE_URL\" --output \"$RUNNER_TEMP/analysis\"\nfi"
        },
        {
          "name": "Connect the designated Vertex identity",
          "id": "vertex",
          "uses": "google-github-actions/auth@v3",
          "with": {
            "workload_identity_provider": "projects/${{ vars.CLIPFORGE_VERTEX_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/clipforge-actions/providers/github",
            "service_account": "clipforge-vertex@project-fdadb4dd-cb77-4270-9cd.iam.gserviceaccount.com",
            "token_format": "access_token",
            "access_token_lifetime": "3600s",
            "access_token_scopes": "https://www.googleapis.com/auth/cloud-platform",
            "create_credentials_file": true,
            "export_environment_variables": true
          },
          "if": "inputs.editorial_release == '' || inputs.continue_missing"
        },
        {
          "name": "Restore saved editorial responses without resubmitting them",
          "if": "inputs.editorial_release != ''",
          "env": {
            "GH_TOKEN": "${{ secrets.CLIPFORGE_PAT }}",
            "EDITORIAL_RELEASE": "${{ inputs.editorial_release }}"
          },
          "run": "[[ \"$EDITORIAL_RELEASE\" =~ ^clipforge-kick-editorial-(replay-)?[0-9]+$ ]] || exit 1\nmkdir -p \"$RUNNER_TEMP/saved-editorial\"\ngh release download \"$EDITORIAL_RELEASE\" --repo nyu1791-collab/ai-model-workers --pattern '*.json' --pattern '*.prompt.txt' --dir \"$RUNNER_TEMP/saved-editorial\"\n"
        },
        {
          "name": "Process selected topics with overlapping GPU ASR, cleanup and render",
          "timeout-minutes": 100,
          "env": {
            "CLIPFORGE_VERTEX_ACCESS_TOKEN": "${{ steps.vertex.outputs.access_token }}",
            "SOURCE_URL": "${{ inputs.source_url }}",
            "EDITORIAL_RELEASE": "${{ inputs.editorial_release }}",
            "CONTINUE_MISSING": "${{ inputs.continue_missing }}",
            "CONFIG_FILE": "${{ inputs.config_file }}",
            "TARGET_CLIPS": "${{ inputs.target_clips }}",
            "CLIPFORGE_AUDIENCE_FEEDBACK": "${{ inputs.audience_feedback }}",
            "GH_TOKEN": "${{ secrets.CLIPFORGE_PAT }}",
            "COLAB_ADC_JSON": "${{ secrets.COLAB_ADC_JSON }}",
            "REQUEST_ID": "${{ inputs.request_id }}",
            "CLIPFORGE_SOURCE_REF": "${{ inputs.source_ref }}",
            "CLIPFORGE_COLAB_CONTROL_PYTHON": "${{ runner.temp }}/colab-control/bin/python",
            "CLIPFORGE_STREAMING_RENDER": "${{ inputs.auto_render && inputs.result_store == 'release' }}",
            "YOUTUBE_COOKIES_B64": "${{ secrets.YOUTUBE_COOKIES_B64 }}"
          },
          "run": "[[ \"$CONFIG_FILE\" =~ ^config\\.[a-z0-9-]+\\.example\\.json$ ]] || exit 1\nextra=()\nif [ -n \"$TARGET_CLIPS\" ]; then [[ \"$TARGET_CLIPS\" =~ ^([1-9]|10)$ ]] || exit 1; extra+=(--clips \"$TARGET_CLIPS\"); fi\nif [ -n \"$EDITORIAL_RELEASE\" ]; then extra+=(--resume-from \"$RUNNER_TEMP/saved-editorial\"); fi\nif [ \"$CONTINUE_MISSING\" = true ]; then test -n \"$EDITORIAL_RELEASE\"; extra+=(--continue-missing); fi\n.venv/bin/python -m clipforge.audio_understanding plan --audio \"$RUNNER_TEMP/analysis/audio.m4a\" --url \"$SOURCE_URL\" --output \"$RUNNER_TEMP/editorial\" --config \"$CONFIG_FILE\" \"${extra[@]}\"\n",
          "id": "process"
        },
        {
          "name": "Release any owned selected-audio GPU",
          "id": "asr-stop",
          "if": "always() && steps.asr-control.outcome == 'success'",
          "timeout-minutes": 5,
          "run": "\"$RUNNER_TEMP/colab-control/bin/python\" tools/selected_gpu_asr.py --stop --output \"$RUNNER_TEMP/editorial\"\n"
        },
        {
          "name": "Release any owned streaming render GPUs",
          "if": "always() && steps.asr-control.outcome == 'success'",
          "timeout-minutes": 5,
          "run": "\"$RUNNER_TEMP/colab-control/bin/python\" tools/parallel_selected_render.py --stop\n"
        },
        {
          "name": "Save transcripts review and timing privately",
          "if": "always()",
          "env": {
            "GH_TOKEN": "${{ secrets.CLIPFORGE_PAT }}"
          },
          "run": "if [ \"$(gh api repos/nyu1791-collab/ai-model-workers --jq .private)\" != true ]; then echo \"Private storage is required.\"; exit 1; fi\nshopt -s nullglob\nreports=(\"$RUNNER_TEMP/editorial/\"*.json \"$RUNNER_TEMP/editorial/\"*.txt \"$RUNNER_TEMP/editorial/\"*.ogg \"$RUNNER_TEMP/editorial/\"*.zip)\nif [ ${#reports[@]} -gt 0 ]; then\n gh release create \"clipforge-kick-editorial-$GITHUB_RUN_ID\" \"${reports[@]}\" --repo nyu1791-collab/ai-model-workers --latest=false --notes \"Private audio understanding and selected-only transcription; no full-source ASR.\"\nfi",
          "id": "save-editorial"
        },
        {
          "name": "Preserve completed clips for explicit render-only reuse",
          "if": "always() && inputs.auto_render && inputs.result_store == 'release' && steps.process.outcome != 'success' && steps.save-editorial.outcome == 'success'",
          "continue-on-error": true,
          "timeout-minutes": 15,
          "env": {
            "GH_TOKEN": "${{ secrets.CLIPFORGE_PAT }}",
            "CLIPFORGE_SOURCE_REF": "${{ inputs.source_ref }}",
            "REQUEST_ID": "${{ inputs.request_id }}",
            "RESULT_STORE": "release"
          },
          "run": "if [ -f \"$RUNNER_TEMP/editorial/final-selection.json\" ] && [ -f \"$RUNNER_TEMP/editorial/selected-transcripts.json\" ] && [ -f \"$RUNNER_TEMP/editorial/audio-editor-receipt.json\" ]; then\n  mkdir -p \"$RUNNER_TEMP/editorial-render\"\n  cp \"$RUNNER_TEMP/editorial/final-selection.json\" \"$RUNNER_TEMP/editorial/selected-transcripts.json\" \"$RUNNER_TEMP/editorial/audio-editor-receipt.json\" \"$RUNNER_TEMP/editorial-render/\"\n  REVIEW_FILE=\"$RUNNER_TEMP/editorial/final-selection.json\" \"$RUNNER_TEMP/colab-control/bin/python\" tools/parallel_selected_render.py --collect-partial\nelse\n  echo \"Editing did not finish; individual completed clips remain available for collection.\"\nfi\n"
        },
        {
          "name": "Remove saved selected-audio input release",
          "id": "asr-input-cleanup",
          "if": "always() && steps.save-editorial.outcome == 'success' && steps.asr-stop.outcome == 'success'",
          "continue-on-error": true,
          "timeout-minutes": 5,
          "env": {
            "GH_TOKEN": "${{ secrets.CLIPFORGE_PAT }}"
          },
          "run": "\"$RUNNER_TEMP/colab-control/bin/python\" tools/selected_gpu_asr.py --cleanup-input --output \"$RUNNER_TEMP/editorial\"\n"
        },
        {
          "name": "Report a retained temporary selected-audio input",
          "if": "always() && steps.asr-input-cleanup.outcome == 'failure'",
          "run": "echo \"::warning::Selected-audio input could not be deleted. The private saved ASR state identifies it.\"\n"
        }
      ],
      "permissions": {
        "contents": "read",
        "actions": "read",
        "id-token": "write"
      }
    },
    "selected-audio-render": {
      "if": "github.repository == 'nyu1791-collab/ClipForge' && inputs.audio_stage == 'understanding' && inputs.auto_render",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 100,
      "env": {
        "CLIPFORGE_SOURCE_REF": "${{ inputs.source_ref }}",
        "REQUEST_ID": "${{ inputs.request_id }}",
        "INPUT_TAG": "${{ inputs.input_tag }}",
        "AUDIO_STAGE": "render",
        "PREVIOUS_RUN": "${{ inputs.previous_run_id || github.run_id }}",
        "PREVIOUS_REQUEST": "${{ inputs.previous_request_id || inputs.request_id }}",
        "CLIP_INDEX": "${{ inputs.clip_index }}",
        "REVIEW_JSON": "${{ inputs.review_json }}",
        "CONFIG_FILE": "${{ inputs.config_file }}",
        "PYTHONUNBUFFERED": "1",
        "CLIPFORGE_PUBLIC_CACHE": "off",
        "RESULT_STORE": "${{ inputs.result_store }}",
        "CLIPFORGE_STORAGE_REPO": "nyu1791-collab/ai-model-workers",
        "CLIPFORGE_AUDIO_REVIEW_RELEASE": "clipforge-kick-editorial-${{ github.run_id }}"
      },
      "steps": [
        {
          "name": "Require storage and GPU connections before downloading",
          "env": {
            "STORE_TOKEN": "${{ secrets.CLIPFORGE_PAT }}",
            "STORE_MODE": "${{ inputs.result_store }}",
            "COLAB_CONNECTION": "${{ secrets.COLAB_ADC_JSON }}"
          },
          "run": "test -n \"$STORE_TOKEN\" || { echo \"Register CLIPFORGE_PAT in ClipForge secrets.\"; exit 1; }\nif [ -n \"$STORE_MODE\" ] && [ \"$STORE_MODE\" != release ]; then echo \"Public execution supports private Release storage only.\"; exit 1; fi\ntest -n \"$COLAB_CONNECTION\" || { echo \"Register COLAB_ADC_JSON using tools/configure_colab_oauth.py before rendering.\"; exit 1; }"
        },
        {
          "name": "Use the pinned production source",
          "env": {
            "REQUESTED_SOURCE": "${{ inputs.source_ref }}"
          },
          "run": "[[ \"$REQUESTED_SOURCE\" =~ ^[a-f0-9]{40}$ ]] || exit 1\n",
          "timeout-minutes": 1
        },
        {
          "name": "Load completed selected-only subtitles for GPU rendering",
          "env": {
            "GH_TOKEN": "${{ secrets.CLIPFORGE_PAT }}"
          },
          "run": "mkdir -p \"$RUNNER_TEMP/editorial-render\"\ngh release download \"$CLIPFORGE_AUDIO_REVIEW_RELEASE\" --repo nyu1791-collab/ai-model-workers --pattern final-selection.json --pattern selected-transcripts.json --pattern audio-editor-receipt.json --dir \"$RUNNER_TEMP/editorial-render\"\ncp \"$RUNNER_TEMP/editorial-render/final-selection.json\" \"$RUNNER_TEMP/review.json\"\n"
        },
        {
          "name": "Validate the clip render request",
          "run": "python3 - <<'PY'\nimport os,re,json,pathlib\nif os.environ['AUDIO_STAGE'] != 'render':\n    raise SystemExit('worker=colab-auto requires audio_stage=render; use worker=cpu for previews or merge')\nfor key,length in [('CLIPFORGE_SOURCE_REF',40),('REQUEST_ID',32),('PREVIOUS_REQUEST',32)]:\n    assert re.fullmatch('[a-f0-9]{'+str(length)+'}',os.environ[key])\nassert os.environ['INPUT_TAG']=='clipforge-input-'+os.environ['REQUEST_ID']\nassert re.fullmatch('[0-9]{1,20}',os.environ['PREVIOUS_RUN'])\nassert os.environ['CLIP_INDEX']=='' or re.fullmatch('[1-9][0-9]?',os.environ['CLIP_INDEX'])\nassert re.fullmatch(r'config\\.[a-z0-9-]+\\.example\\.json',os.environ['CONFIG_FILE'])\ntext=(pathlib.Path(os.environ['RUNNER_TEMP'])/'review.json').read_text()\nassert text and len(text.encode())<=4*1024**2\njson.loads(text)\npath=pathlib.Path(os.environ['RUNNER_TEMP'])/'review.json'\npath.write_text(text)\npath.chmod(0o600)\nPY\n"
        },
        {
          "uses": "actions/checkout@v4",
          "with": {
            "repository": "nyu1791-collab/ClipForge",
            "ref": "${{ inputs.source_ref }}",
            "path": "clipforge-source",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "uses": "astral-sh/setup-uv@v6",
          "with": {
            "version": "0.12.23",
            "enable-cache": true,
            "cache-dependency-glob": "clipforge-source/tools/colab-control-requirements.txt"
          }
        },
        {
          "name": "Install the locked Google Colab control SDK",
          "id": "control",
          "run": "uv venv \"$RUNNER_TEMP/colab-control\" --python 3.12\nuv pip install --python \"$RUNNER_TEMP/colab-control/bin/python\" --require-hashes \\\n  -r clipforge-source/tools/colab-control-requirements.txt\n"
        },
        {
          "name": "Create the private transfer release for this clip",
          "env": {
            "GH_TOKEN": "${{ secrets.CLIPFORGE_PAT }}"
          },
          "run": "gh release create \"$INPUT_TAG\" --repo \"$CLIPFORGE_STORAGE_REPO\" --target main \\\n  --title \"$INPUT_TAG\" --latest=false \\\n  --notes 'Temporary private ClipForge clip transfer. Deleted after collection.'\n",
          "if": "inputs.result_store != 'release'"
        },
        {
          "name": "Collect saved streaming clips and publish private output",
          "env": {
            "COLAB_ADC_JSON": "${{ secrets.COLAB_ADC_JSON }}",
            "YOUTUBE_COOKIES_B64": "${{ secrets.YOUTUBE_COOKIES_B64 }}",
            "GH_TOKEN": "${{ secrets.CLIPFORGE_PAT }}"
          },
          "run": "if [ \"$RESULT_STORE\" = release ]; then\n  REVIEW_FILE=\"$RUNNER_TEMP/review.json\" \"$RUNNER_TEMP/colab-control/bin/python\" clipforge-source/tools/parallel_selected_render.py --collect-only\nelse\n  REVIEW_FILE=\"$RUNNER_TEMP/review.json\" \"$RUNNER_TEMP/colab-control/bin/python\" clipforge-source/tools/parallel_selected_render.py\nfi\n"
        },
        {
          "name": "Release and verify every owned parallel runtime",
          "if": "always() && steps.control.outcome == 'success'",
          "timeout-minutes": 5,
          "run": "\"$RUNNER_TEMP/colab-control/bin/python\" clipforge-source/tools/parallel_selected_render.py --stop\n"
        },
        {
          "name": "Delete the private transfer release",
          "id": "input-cleanup",
          "timeout-minutes": 10,
          "if": "inputs.result_store != 'release' && always()",
          "continue-on-error": true,
          "env": {
            "GH_TOKEN": "${{ secrets.CLIPFORGE_PAT }}"
          },
          "run": "if ! [[ $INPUT_TAG =~ ^clipforge-input-[a-f0-9]{32}$ ]]; then\n  echo 'Unexpected temporary input tag; nothing was deleted.' >&2\n  exit 1\nfi\nif [ \"$(gh api \"repos/$CLIPFORGE_STORAGE_REPO\" --jq .private)\" != true ]; then\n  echo 'The worker repository must remain private; nothing was deleted.' >&2\n  exit 1\nfi\nif gh release view \"$INPUT_TAG\" --repo \"$CLIPFORGE_STORAGE_REPO\" >/dev/null 2>&1; then\n  gh release delete \"$INPUT_TAG\" --repo \"$CLIPFORGE_STORAGE_REPO\" --yes --cleanup-tag\n  echo 'Temporary private transfer release deleted.'\nelse\n  echo 'No temporary private transfer release remains.'\nfi\n"
        },
        {
          "name": "Report a transfer release that could not be deleted",
          "timeout-minutes": 5,
          "if": "always() && inputs.result_store != 'release' && steps.input-cleanup.outcome != 'success'",
          "run": "echo \"::warning title=Temporary private transfer remains::$INPUT_TAG may still hold private data. Delete it with tools/submit_job.py --cleanup-tag $INPUT_TAG.\"\n{\n  echo '### Temporary private transfer remains'\n  echo \"The release \\`$INPUT_TAG\\` could not be confirmed deleted. Delete it with \\`tools/submit_job.py --cleanup-tag $INPUT_TAG\\`.\"\n} >> \"$GITHUB_STEP_SUMMARY\"\n"
        }
      ],
      "needs": [
        "audio-understanding"
      ]
    }
  },
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "request_id": {
          "type": "string",
          "required": true
        },
        "input_tag": {
          "type": "string",
          "required": true
        },
        "source_ref": {
          "type": "string",
          "required": true
        },
        "audio_stage": {
          "type": "choice",
          "options": [
            "previews",
            "render",
            "merge",
            "understanding"
          ],
          "required": true
        },
        "previous_run_id": {
          "type": "string",
          "required": false,
          "default": ""
        },
        "previous_request_id": {
          "type": "string",
          "required": false,
          "default": ""
        },
        "review_json": {
          "type": "string",
          "default": ""
        },
        "worker": {
          "description": "Hosted CPU runner, or a Colab runtime from the cheapest-first pool (render only)",
          "type": "choice",
          "options": [
            "cpu",
            "colab-auto"
          ],
          "default": "colab-auto"
        },
        "clip_index": {
          "description": "Render only this reviewed clip (1-20); empty renders every clip",
          "type": "string",
          "default": ""
        },
        "part_runs": {
          "description": "For merge, comma-separated RUN_ID:REQUEST_ID of the clip renders",
          "type": "string",
          "default": ""
        },
        "config_file": {
          "description": "Committed config.NAME.example.json at source_ref (render; merge uses the parts' file)",
          "type": "string",
          "default": "config.landscape.example.json"
        },
        "result_store": {
          "description": "Temporary private output transfer; the final delivery is Google Drive",
          "type": "choice",
          "options": [
            "artifact",
            "release"
          ],
          "default": "release"
        },
        "source_url": {
          "type": "string",
          "default": "",
          "description": "Source URL for audio understanding; no full-source ASR"
        },
        "editorial_release": {
          "type": "string",
          "default": "",
          "description": "Private editorial bundle or explicit revision; revision bundles render without Gemini"
        },
        "continue_missing": {
          "type": "boolean",
          "default": false
        },
        "auto_render": {
          "type": "boolean",
          "default": false
        },
        "resume_render": {
          "type": "boolean",
          "default": false,
          "description": "Reuse completed clips from previous_run_id/previous_request_id without re-encoding"
        },
        "target_clips": {
          "description": "Advisory topic count; blank uses the committed config",
          "type": "string",
          "default": ""
        },
        "audience_feedback": {
          "description": "Optional viewing-data note for topic selection (autopilot); at most 1000 characters",
          "type": "string",
          "default": ""
        },
        "review_approved": {
          "type": "boolean",
          "default": false,
          "description": "User explicitly approved this selection for rendering"
        },
        "approved_selection_sha256": {
          "type": "string",
          "default": "",
          "description": "SHA-256 of approved private editorial data"
        },
        "approved_transcripts_sha256": {
          "type": "string",
          "default": "",
          "description": "SHA-256 of approved private editorial data"
        }
      }
    }
  }
}
